<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Adil's Cocktails · Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="daten/kern.css">
<style>
:root{--bk-head:"Archivo Narrow",Impact,sans-serif;--bk-font:Archivo,system-ui,sans-serif;--bk-bg:#000;--bk-accent:#ff6a3d;--bk-accent-fg:#1a0700;--bk-card:#161616;--bk-line:#262626;--bk-muted:#9a9a9a;--acc:#ff6a3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Archivo,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:max(10px,env(safe-area-inset-top)) 12px 28px;background:linear-gradient(rgba(0,0,0,.75),transparent);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.top button{white-space:nowrap;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;color:#ccc;background:rgba(255,255,255,.1);backdrop-filter:blur(10px)}
.top button[aria-selected=true]{background:#fff;color:#000}
.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
.slide .bg{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(30px) brightness(.45);}
.slide .ph{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);height:min(66dvh,820px);aspect-ratio:4/5;max-width:92vw;object-fit:cover;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.92));pointer-events:none}
.info{position:absolute;left:0;right:76px;bottom:0;z-index:5;padding:0 18px max(26px,env(safe-area-inset-bottom))}
.info .k{color:var(--acc);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem}
.info h2{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:clamp(2.4rem,10vw,4.4rem);line-height:.95;text-transform:uppercase;margin:4px 0 8px}
.info p{margin:0 0 12px;color:#ddd;line-height:1.4;max-width:46ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:.78rem;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.side{position:absolute;right:10px;bottom:max(30px,env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;gap:16px;align-items:center}
.side button{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:grid;place-items:center}
.side button.pri{background:var(--acc);color:#1a0700;width:62px;height:62px}
.side button.an svg{fill:var(--acc);stroke:var(--acc)}
.side svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side small{display:block;font-size:.66rem;margin-top:-10px;color:#ccc}
.zahl{position:fixed;right:14px;top:max(60px,calc(env(safe-area-inset-top) + 52px));z-index:20;font-size:.8rem;color:#bbb}
/* Bottom sheet */
.bs{position:fixed;inset:0;z-index:100;display:none}
.bs.offen{display:block}
.bs .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:f .2s}
.bs .pnl{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:#121212;border-radius:26px 26px 0 0;padding:10px 20px max(24px,env(safe-area-inset-bottom));animation:h .3s;max-width:720px;margin:0 auto}
@keyframes f{from{opacity:0}}@keyframes h{from{transform:translateY(100%)}}
.griff{width:44px;height:5px;border-radius:3px;background:#333;margin:0 auto 14px}
.pnl h3{font-family:"Archivo Narrow",sans-serif;font-size:2rem;text-transform:uppercase;margin:0 0 4px}
.pnl .m{color:#9a9a9a;font-size:.9rem;margin-bottom:14px}
.pnl h4{margin:20px 0 8px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);display:flex;justify-content:space-between;align-items:center}
.port{display:flex;align-items:center;background:#1d1d1d;border-radius:999px;padding:3px;letter-spacing:0;text-transform:none;color:#fff;font-size:.85rem}
.port button{width:32px;height:32px;border-radius:50%;font-size:1.1rem}.port span{min-width:80px;text-align:center}
.pnl ul{list-style:none;margin:0;padding:0}.pnl li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #222}
.pnl li b{color:#fff}
.pnl ol{padding-left:22px;margin:0;line-height:1.5}.pnl ol li{display:list-item;border:0;padding:6px 0}
.start{display:block;width:100%;margin-top:22px;height:60px;border-radius:16px;background:var(--acc);color:#1a0700;font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase}
.credit{color:#777;font-size:.72rem;margin-top:16px}.credit a{color:#777}
.hint{background:#241a14;border-radius:12px;padding:10px 12px;color:#e8c9b2;font-size:.88rem;margin-top:12px}
.leer{height:100dvh;display:grid;place-items:center;color:#888;text-align:center;padding:30px}
</style>
</head>
<body>
<div class="top" id="top" role="tablist"></div>
<div class="zahl" id="zahl"></div>
<div class="feed" id="feed"></div>
<div class="bs" id="bs"><div class="scrim"></div><div class="pnl" id="pnl"></div></div>
<script src="daten/rezepte.js"></script>
<script src="daten/kern.js"></script>
<script>
const $=s=>document.querySelector(s), feed=$('#feed'), bs=$('#bs'), pnl=$('#pnl');
const state={kat:'alle'}; let list=[], cur=null, p=1;
const tabs=[{id:'alle',name:'Für dich'},{id:'fav',name:'Favoriten'},...Bar.kategorien];
const I={herz:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9.1C1.1 8.6 3 5 6.4 5c2 0 3.6 1.1 4.4 2.6h.4C12 6.1 13.6 5 15.6 5 19 5 20.900 8.600 21.300 11.900 19 16.400 12 21 12 21z"/></svg>',
 liste:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
 play:'<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4.500v15l13-7.500z"/></svg>'};
function renderTabs(){$('#top').innerHTML=tabs.map(t=>`<button role="tab" aria-selected="${t.id===state.kat}" data-k="${t.id}">${t.name}</button>`).join('')}
function renderFeed(){
  list=Bar.rezepte.filter(r=>state.kat==='alle'||(state.kat==='fav'?Bar.isFav(r.id):r.kategorie===state.kat));
  feed.innerHTML=list.length?list.map((r,i)=>`<section class="slide" data-i="${i}">
    <img class="bg" src="${r.bild}" alt=""><img class="ph" src="${r.bild}" alt="${Bar.esc(r.name)}" loading="${i<2?'eager':'lazy'}">
    <div class="info"><div class="k">${Bar.katName(r.kategorie)}</div><h2>${Bar.esc(r.name)}</h2><p>${Bar.esc(r.beschreibung)}</p>
      <div class="tags"><span>${r.zeit} Min.</span><span>${Bar.staerkeText(r.staerke)}</span>${r.geschmack.slice(0,2).map(g=>`<span>${g}</span>`).join('')}</div></div>
    <div class="side"><button class="${Bar.isFav(r.id)?'an':''}" data-fav="${r.id}" aria-label="Favorit">${I.herz}</button>
      <button data-rez="${r.id}" aria-label="Rezept">${I.liste}</button>
      <button class="pri" data-go="${r.id}" aria-label="Zubereitung starten">${I.play}</button></div></section>`).join('')
    :'<div class="leer">Noch keine Favoriten.<br>Tippe auf das Herz bei einem Drink.</div>';
  feed.scrollTop=0; zaehl();
}
function zaehl(){const i=Math.round(feed.scrollTop/innerHeight);$('#zahl').textContent=list.length?`${Math.min(i+1,list.length)} / ${list.length}`:''}
feed.addEventListener('scroll',zaehl,{passive:true});
function sheet(id){
  cur=Bar.byId(id);p=1;bs.classList.add('offen');paint();
}
function paint(){const r=cur;
  pnl.innerHTML=`<div class="griff"></div><h3>${Bar.esc(r.name)}</h3><div class="m">${Bar.esc(r.glas)} · ${r.technik} · ${r.zeit} Min.</div>${Bar.esc(r.beschreibung)}
   ${r.hinweis?`<div class="hint">${Bar.esc(r.hinweis)}</div>`:''}
   <h4>Zutaten <span class="port"><button data-p="-1" aria-label="Weniger">−</button><span>${p} ${p===1?'Portion':'Portionen'}</span><button data-p="1" aria-label="Mehr">+</button></span></h4>
   <ul>${r.zutaten.map(z=>`<li><span>${Bar.esc(z.n)}</span><b>${Bar.menge(z,p)}</b></li>`).join('')}</ul>
   <h4>Zubereitung</h4><ol>${r.schritte.map(s=>`<li>${Bar.esc(s.t)}</li>`).join('')}</ol>
   <h4>Garnitur</h4>${Bar.esc(r.garnitur)}
   <button class="start" data-go="${r.id}">Zubereitung starten</button><div class="credit">${Bar.credit(r)}</div>`;
}
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]'),f=e.target.closest('[data-fav]'),rz=e.target.closest('[data-rez]'),go=e.target.closest('[data-go]'),pp=e.target.closest('[data-p]');
  if(k){state.kat=k.dataset.k;renderTabs();renderFeed()}
  else if(f){f.classList.toggle('an',Bar.toggleFav(f.dataset.fav))}
  else if(go){Bar.kochen(Bar.byId(go.dataset.go),cur&&bs.classList.contains('offen')?p:1)}
  else if(rz)sheet(rz.dataset.rez);
  else if(pp){p=Math.max(1,Math.min(12,p+(+pp.dataset.p)));paint()}
  else if(e.target.classList.contains('scrim'))bs.classList.remove('offen');
});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.bk'))return;
  if(e.key==='Escape')bs.classList.remove('offen');
  if(e.key==='ArrowDown')feed.scrollBy({top:innerHeight,behavior:'smooth'});
  if(e.key==='ArrowUp')feed.scrollBy({top:-innerHeight,behavior:'smooth'});
});
renderTabs();renderFeed();
</script>
</body>
</html>
