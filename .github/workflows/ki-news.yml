name: KI-News aktualisieren
on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ki-news/fetch.py
      - run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add flow-dna/news.js flow-dna/news.json
          git diff --cached --quiet || (git commit -m "KI-News aktualisiert" && git push)
