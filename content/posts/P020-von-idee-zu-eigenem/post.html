<style>

*{box-sizing:border-box;margin:0;padding:0}

.ph{position:absolute;left:0;top:0;width:1080px;height:810px;background:url(foto_gross.jpg) center/cover;filter:grayscale(1) contrast(1.02) brightness(.62)}
.net{position:absolute;left:0;top:0;width:1080px;height:810px;mix-blend-mode:screen}

.txt{position:absolute;left:64px;right:64px;top:800px}
.lab{font:500 19px Montserrat;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55)}
h1{margin-top:22px;font:700 118px/.9 Oswald;text-transform:uppercase}
h1 .o{color:transparent;-webkit-text-stroke:2px #fff}
.sub{margin-top:28px;font:300 30px/1.4 Inter;color:rgba(255,255,255,.8);max-width:860px}
.foot{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;align-items:center;font:500 17px Montserrat;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.foot img{height:30px}
