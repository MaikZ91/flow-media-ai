<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--black:#0B0B0B;--white:#fff;--grey:#9A9A9A;--blue:#2F5BFF}
*{box-sizing:border-box;margin:0}
html,body{background:var(--black);color:#fff;font-family:Inter,sans-serif;overflow:hidden}
#c{position:relative;overflow:hidden;background:var(--black)}
.ph{position:absolute;left:0;right:0;top:0;background:url(img/maik_anzug.png) center top/cover;filter:grayscale(1) contrast(1.15) brightness(.95)}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,.55) 0%,rgba(11,11,11,0) 16%,rgba(11,11,11,0) 42%,rgba(11,11,11,.85) 62%,#0B0B0B 80%)}
.grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.logo{position:absolute;left:76px;top:72px;width:190px}
.tag{position:absolute;right:76px;top:86px;font:500 22px Montserrat;letter-spacing:.2em;color:#d8d8d8;text-transform:uppercase}
.txt{position:absolute;left:76px;right:76px}
.k{font:500 24px Montserrat;letter-spacing:.2em;text-transform:uppercase;color:#d8d8d8}
.h{font:700 132px/.92 Oswald;text-transform:uppercase;margin-top:20px}
.rule{height:1px;background:rgba(255,255,255,.22);margin:34px 0 28px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.cols b{display:block;font:700 62px/1 Oswald;text-transform:uppercase}
.cols span{display:block;margin-top:12px;font:400 23px/1.35 Inter;color:#cfcfcf}
.b{color:var(--blue)}
/* feed 1080x1350 */
.feed #c{width:1080px;height:1350px}
.feed .ph{height:1372px}
.feed .txt{bottom:76px}
/* story 1080x1920 */
.story #c{width:1080px;height:1920px}
.story .ph{height:1240px}
.story .fade{background:linear-gradient(180deg,rgba(11,11,11,.55) 0%,rgba(11,11,11,0) 12%,rgba(11,11,11,0) 38%,rgba(11,11,11,.9) 54%,#0B0B0B 64%)}
.story .txt{top:930px}
.story .h{font-size:132px}
.story .cols{grid-template-columns:1fr;gap:20px}
.story .cols b{font-size:62px;display:inline-block;width:310px}
.story .cols span{display:inline-block;margin:0;font-size:27px;vertical-align:middle;width:560px}
</style></head>
<body>
<div id="c">
  <div class="ph"></div><div class="fade"></div><div class="grain"></div>
  <img class="logo" src="img/logo_flow.png" alt="">
  <div class="tag">KI · Apps · Automatisierung</div>
  <div class="txt">
    <div class="k">Flow Media AI · Personal Brand</div>
    <div class="h">Hey,<br>ich bin Maik.</div>
    <div class="rule"></div>
    <div class="cols">
      <div><b>Build.</b><span>Ideen in Tools, Apps und Websites verwandeln.</span></div>
      <div><b>Connect.</b><span>Menschen zusammenbringen, die etwas aufbauen.</span></div>
      <div><b class="b">Enable.</b><span>Dich befähigen, es selbst zu können.</span></div>
    </div>
  </div>
</div>
<script>document.body.className = location.hash.slice(1) || "feed";</script>
</body></html>
