<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#0B0B0B;--paper:#F4F4F1;--blue:#2F5BFF}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0B;color:#fff;font-family:Inter,sans-serif}
.l{position:absolute;opacity:0}
.k{font:600 30px Montserrat;letter-spacing:.22em;text-transform:uppercase;color:#cfcfcf}
.h{font:700 150px/.9 Oswald;text-transform:uppercase}.h span{color:var(--blue)}
.logo{left:70px;top:90px;width:190px;z-index:60}
#ph{inset:0;background:url(img/portrait_front.jpg) center 18%/cover;filter:grayscale(1) contrast(1.12) brightness(.85)}
#phs{inset:0;background:linear-gradient(180deg,rgba(11,11,11,.5),rgba(11,11,11,0) 25%,rgba(11,11,11,0) 38%,rgba(11,11,11,.95) 62%,#0B0B0B)}
#hook{left:70px;right:70px;top:1050px}#hook .h{font-size:160px}#hook .k{margin-bottom:22px}
#hook .s{display:inline-block;font:700 56px Oswald;text-transform:uppercase;margin-top:28px;background:var(--blue);padding:10px 24px}
/* Uhr */
#clock{left:0;right:0;top:330px;height:820px}
#clock svg{position:absolute;left:140px;top:0;width:800px;height:800px}
#ring{transition:none}
#time{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 260px/1 Oswald;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#tl{position:absolute;left:0;right:0;top:540px;text-align:center;font:600 30px Montserrat;letter-spacing:.24em;text-transform:uppercase;color:#cfcfcf}
#phase{left:70px;right:70px;top:1220px}
#phase .k{color:var(--blue)}
#phase .h{font-size:120px;margin-top:14px}
#phase .d{font:500 40px/1.3 Inter;color:#ddd;margin-top:20px}
#steps{left:70px;right:70px;top:1620px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#steps div{border-top:8px solid #333;padding-top:14px;font:700 34px Oswald;text-transform:uppercase;color:#777}
#steps div.on{border-color:var(--blue);color:#fff}#steps div.ok{border-color:#fff;color:#bbb}
#av{left:70px;top:210px;display:flex;align-items:center;gap:18px;font:600 26px Montserrat;letter-spacing:.14em;text-transform:uppercase;color:#cfcfcf}
#av img{width:84px;height:84px;border-radius:50%;filter:grayscale(1);border:3px solid #fff;object-fit:cover}
#flash{inset:0;background:var(--blue);z-index:70}
#done{left:70px;right:70px;top:560px;z-index:71}#done .h{font-size:190px}#done .k{color:#fff}
#prod{left:70px;right:70px;top:1180px;z-index:71;display:flex;flex-wrap:wrap;gap:16px}
#prod span{font:700 58px Oswald;text-transform:uppercase;border:4px solid #fff;padding:10px 24px;opacity:0}
#lp{inset:0;background:url(img/portrait_laptop.jpg) center/cover;filter:grayscale(1) contrast(1.1) brightness(.6)}
#lps{inset:0;background:linear-gradient(180deg,rgba(11,11,11,.4),rgba(11,11,11,.2) 26%,rgba(11,11,11,.94) 50%,#0B0B0B)}
#end{left:70px;right:70px;top:820px}#end .h{font-size:116px}
#end .when{display:grid;grid-template-columns:auto 1fr;gap:6px 30px;margin-top:36px;font:700 60px/1.05 Oswald;text-transform:uppercase}
#end .when em{font:600 26px Montserrat;font-style:normal;letter-spacing:.2em;color:#cfcfcf;align-self:center}
#end .cta{display:inline-block;margin-top:38px;font:700 58px Oswald;text-transform:uppercase;background:var(--blue);padding:14px 28px}
#end .fl{margin-top:30px}
.bar{left:0;top:0;height:10px;background:var(--blue);z-index:80;opacity:1}
</style></head><body>
<img class="l logo" id="logo" src="img/logo_flow.png" style="opacity:1">
<div class="l" id="ph"></div><div class="l" id="phs"></div>
<div class="l" id="hook"><div class="k">Workshop · live</div><div class="h">Deine Idee.<br><span>60 Minuten.</span></div><div class="s">Ein echtes Produkt.</div></div>

<div class="l" id="av"><img src="img/maik_avatar.jpg"><span>Live mit Maik</span></div>
<div class="l" id="clock"><svg viewBox="0 0 800 800"><circle cx="400" cy="400" r="370" fill="none" stroke="#222" stroke-width="22"/><circle id="ring" cx="400" cy="400" r="370" fill="none" stroke="#2F5BFF" stroke-width="22" stroke-linecap="round" transform="rotate(-90 400 400)" stroke-dasharray="2324.78" stroke-dashoffset="0"/></svg>
 <div id="time">60:00</div><div id="tl">Minuten übrig</div></div>
<div class="l" id="phase"><div class="k" id="pk"></div><div class="h" id="ph2"></div><div class="d" id="pd"></div></div>
<div class="l" id="steps"><div>F</div><div>L</div><div>O</div><div>W</div></div>

<div class="l" id="flash"></div>
<div class="l" id="done"><div class="k">00:00</div><div class="h">Dein Produkt <span style="color:#0B0B0B">steht.</span></div></div>
<div class="l" id="prod"><span>App</span><span>Website</span><span>Automatisierung</span><span>Buch</span></div>

<div class="l" id="lp"></div><div class="l" id="lps"></div>
<div class="l" id="end"><div class="k">Workshop</div><div class="h">Von deiner KI-Idee zum <span>digitalen Produkt.</span></div>
 <div class="when"><em>Wann</em><span>Mo 16.11.</span><em>Zeit</em><span>18–19 Uhr · live</span></div>
 <div class="cta">Platz sichern</div><div class="k fl">Link in der Bio · Komm in den Flow.</div></div>
<div class="l bar" id="bar"></div>
<script>
const B=0.465;const T=[0,6*B,38*B,46*B,54*B];window.TOTAL=T[4]+ -0.0;
const $=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),out=x=>1-Math.pow(1-x,3),io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function vis(id,a,b,dy=40,f=.22){const e=$(id),t=window._t;if(t<a||t>=b){e.style.opacity=0;return 0}const i=out(cl((t-a)/f)),o=1-cl((t-(b-.1))/.1);e.style.opacity=Math.min(i,o);e.style.transform=`translateY(${(1-i)*dy}px)`;return 1}
const PH=[["F · Fokussieren","Idee schärfen.","Aus deinem Gedanken wird ein klares Konzept."],["L · Losbauen","Mit Skills bauen.","Die Flow-DNA-Skills machen die Arbeit."],["O · Optimieren","Testen. Besser machen.","Du sagst, was passt – die KI setzt um."],["W · Wachsen","Fertig für morgen.","Du entwickelst es selbst weiter."]];
window.DRAW=t=>{window._t=t;
 // Hook
 vis('ph',0,T[1],0,.01);$('ph').style.transform=`scale(${1.08-.08*t/T[1]})`;vis('phs',0,T[1],0,.01);vis('hook',0,T[1],60,.25);
 // Uhr: 60:00 -> 00:00, beschleunigt zum Ende
 const inC=t>=T[1]&&t<T[2];['clock','phase','steps','av'].forEach(i=>$(i).style.opacity=inC?Math.min(1,cl((t-T[1])/.2)):0);
 if(inC){const p=cl((t-T[1])/(T[2]-T[1])),q=io(p),sec=Math.round(3600*(1-q));
  $('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  $('ring').setAttribute('stroke-dashoffset',(2324.78*q).toFixed(1));
  const k=Math.min(3,Math.floor(q*4)),lt=q*4-k;$('pk').textContent=PH[k][0];$('ph2').textContent=PH[k][1];$('pd').textContent=PH[k][2];
  const pin=out(cl(lt/.12));$('phase').style.transform=`translateY(${(1-pin)*50}px)`;$('phase').style.opacity=pin;
  [...$('steps').children].forEach((c,i)=>{c.className=i<k?'ok':i===k?'on':''});
  $('time').style.transform=`scale(${1+.05*Math.max(0,1-((t-T[1])%(2*B))/.15)})`;}
 // Fertig
 const inD=t>=T[2]&&t<T[3];$('flash').style.opacity=inD?1:0;vis('done',T[2],T[3],60,.2);$('prod').style.opacity=inD?1:0;
 [...$('prod').children].forEach((c,i)=>{const p=out(cl((t-T[2]-.9-i*2*B*.5)/.18));c.style.opacity=p;c.style.transform=`scale(${.8+.2*p})`});
 $('logo').style.filter=inD?'invert(1)':'';
 // Ende
 vis('lp',T[3],99,0,.01);$('lp').style.transform=`scale(${1.04+.05*cl((t-T[3])/(T[4]-T[3]))})`;vis('lps',T[3],99,0,.01);vis('end',T[3]+.05,99,50,.3);
 $('bar').style.width=(1080*t/T[4])+'px'};
DRAW(0);
</script></body></html>
