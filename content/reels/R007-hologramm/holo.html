<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05060a;color:#fff;font-family:Inter,sans-serif}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
.ov{position:absolute;inset:0;pointer-events:none}
.logo{position:absolute;left:76px;top:116px;width:200px}
.prog{position:absolute;left:76px;right:76px;top:64px;height:3px;background:rgba(255,255,255,.18)}
.prog i{display:block;height:100%;background:#fff;width:0}
.cap{position:absolute;left:76px;right:76px;top:1240px}
.c{position:absolute;inset:0 0 auto 0;opacity:0}
.k{font:500 26px Montserrat;letter-spacing:.18em;text-transform:uppercase;color:#9fb3ff}
.rule{width:64px;height:3px;background:#fff;margin:26px 0}
.h{font:700 112px/.93 Oswald;text-transform:uppercase}
.h.s{font-size:92px}
.b{color:#2F5BFF;text-shadow:0 0 30px rgba(47,91,255,.6)}
.p{font:400 36px/1.4 Inter;color:#dfe4ff;margin-top:24px;max-width:860px}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,transparent 40%,rgba(0,0,0,.65) 100%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px);mix-blend-mode:screen}
</style></head><body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div class="ov">
  <div class="vign"></div><div class="scan"></div>
  <div class="prog"><i id="prog"></i></div>
  <img class="logo" src="logo_flow.png" alt="">
  <div class="cap">
    <div class="c" data-c><div class="k">Build in public</div><div class="rule"></div><div class="h">Ich als<br><span class="b">Hologramm.</span></div><div class="p">Aus einem einzigen Foto. Mit KI.</div></div>
    <div class="c" data-c><div class="k">01 · Ein Foto</div><div class="rule"></div><div class="h s">Ein ganz<br>normales <span class="b">Bild.</span></div></div>
    <div class="c" data-c><div class="k">02 · KI schätzt die Tiefe</div><div class="rule"></div><div class="h s">Hell = nah.<br><span class="b">Dunkel = fern.</span></div></div>
    <div class="c" data-c><div class="k">03 · Punktwolke</div><div class="rule"></div><div class="h s">Daraus wird<br><span class="b">3D.</span></div></div>
    <div class="c" data-c><div class="k">04 · Hologramm</div><div class="rule"></div><div class="h s">Licht, Linien,<br><span class="b">Flow.</span></div></div>
    <div class="c" data-c><div class="k">Build · Connect · Enable</div><div class="rule"></div><div class="h s">Willst du wissen,<br>wie das <span class="b">geht?</span></div><div class="p">Schreib mir.</div></div>
  </div>
</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false); renderer.setClearColor(0x05060a,1);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,W/H,.1,100); cam.position.set(0,.1,9.4); cam.lookAt(0,-.8,0);
const load=u=>new Promise(r=>new THREE.TextureLoader().load(u,t=>{t.colorSpace=THREE.NoColorSpace;r(t)}));
const [photo,depth]=await Promise.all([load("photo.png"),load("depth.png")]);

// point grid over the image (3:4)
const GX=270,GY=360,N=GX*GY,pos=new Float32Array(N*3),uv=new Float32Array(N*2),rnd=new Float32Array(N);
for(let y=0;y<GY;y++)for(let x=0;x<GX;x++){const i=y*GX+x;const u=x/(GX-1),v=1-y/(GY-1);
  pos[i*3]=(u-.5)*2.4;pos[i*3+1]=(v-.5)*3.2+.35;pos[i*3+2]=0;uv[i*2]=u;uv[i*2+1]=v;rnd[i]=Math.random()}
const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("uv",new THREE.BufferAttribute(uv,2));g.setAttribute("rnd",new THREE.BufferAttribute(rnd,1));
const U={uPhoto:{value:photo},uDepth:{value:depth},uT:{value:0},uExt:{value:0},uHolo:{value:0},uShowDepth:{value:0},uGlitch:{value:0},uSize:{value:3.4},uCut:{value:0}};
const mat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`
uniform sampler2D uPhoto,uDepth;uniform float uT,uExt,uHolo,uGlitch,uSize,uCut;attribute float rnd;
varying float vLum,vDepth,vY,vR,vMask;
void main(){
  vec2 st=uv; float d=texture2D(uDepth,st).r; vDepth=d; vLum=texture2D(uPhoto,st).r; vR=rnd;
  vMask=smoothstep(.30,.42,d)*smoothstep(0.0,.12,st.y);            // drop background, fade bottom
  vec3 p=position;
  p.z=(d-.45)*1.9*uExt;
  // glitch: horizontal slices jump sideways
  float slice=floor((p.y+uT*.7)*14.);
  float gj=step(.93,fract(sin(slice*91.7+floor(uT*12.)*13.1)*4375.5));
  p.x+=gj*uGlitch*(fract(sin(slice*7.1)*999.)-.5)*.35;
  // holo drift: points shimmer
  p+=uHolo*vec3(sin(uT*2.+rnd*40.),cos(uT*1.7+rnd*30.),sin(uT*1.3+rnd*20.))*.006;
  vec4 mv=modelViewMatrix*vec4(p,1.);
  vY=p.y;
  gl_PointSize=uSize*(9.4/-mv.z)*(1.+uHolo*.25*rnd);
  gl_Position=projectionMatrix*mv;
}`,
fragmentShader:`
uniform float uT,uHolo,uShowDepth;varying float vLum,vDepth,vY,vR,vMask;
void main(){
  vec2 c=gl_PointCoord-.5; float r=length(c); if(r>.5) discard;
  float soft=smoothstep(.5,.0,r);
  vec3 plain=vec3(pow(vLum,.9))*1.7;
  vec3 dep=mix(vec3(.05,.08,.25),vec3(2.6),pow(smoothstep(.45,1.,vDepth),.8));
  vec3 base=mix(plain,dep,uShowDepth);
  float band=smoothstep(.06,0.,abs(fract(vY*.35-uT*.35)-.5)-.38);          // moving scan band
  float lines=.75+.25*sin(vY*160.+uT*6.);
  vec3 blue=vec3(.18,.36,1.);
  vec3 holo=(mix(blue*.9,vec3(.8,.9,1.),pow(vLum,1.1))*lines + blue*band*1.6)*1.9;
  vec3 col=mix(base,holo,uHolo);
  float a=vMask*soft*mix(.9,.6+.4*pow(vLum,.8),uHolo);
  a*=mix(1.,.85+.15*sin(uT*40.+vR*6.),uHolo);
  gl_FragColor=vec4(col*a,a);
}`});
const bust=new THREE.Points(g,mat); scene.add(bust);

// platform: concentric rings + flowing waves (the Flow motif)
const plat=new THREE.Group(); plat.position.set(0,-1.35,0); scene.add(plat);
const ringMats=[];
for(let i=0;i<5;i++){const r=.7+i*.28,rg=new THREE.RingGeometry(r,r+.012,128);const m=new THREE.MeshBasicMaterial({color:0x2F5BFF,transparent:true,opacity:0,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(rg,m);mesh.rotation.x=-Math.PI/2;plat.add(mesh);ringMats.push(m)}
const waves=[];
for(let i=0;i<7;i++){const n=200,pa=new Float32Array(n*3);const lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.BufferAttribute(pa,3));
  const lm=new THREE.LineBasicMaterial({color:i===3?0x6f8cff:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
  const ln=new THREE.Line(lg,lm);plat.add(ln);waves.push({ln,lm,pa,i})}
// light cone
const cone=new THREE.Mesh(new THREE.CylinderGeometry(.95,1.75,3.4,64,1,true),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,uniforms:{uA:{value:0},uT:U.uT},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform float uA,uT;varying vec2 vUv;void main(){float a=(1.-vUv.y)*.16*uA*(.8+.2*sin(vUv.x*60.+uT*3.));gl_FragColor=vec4(vec3(.2,.4,1.)*a,a);}`}));
cone.position.y=.35; scene.add(cone);
// rising particles
const PN=900,pp=new Float32Array(PN*3),pr=[];for(let i=0;i<PN;i++){pr.push([Math.random()*Math.PI*2,.3+Math.random()*1.6,Math.random()])}
const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pp,3));
const pm=new THREE.PointsMaterial({color:0x8aa4ff,size:.022,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(pg,pm));

const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
// timeline (s): hook 0-3 | photo 3-6 | depth 6-9 | extrude 9-12 | holo 12-18 | cta 18-21
const CAPS=[0,3,6,9,12,18], TOTAL=21; window.TOTAL=TOTAL;
function state(t){
  if(t<3) return {ext:1,holo:1,dep:0,rot:Math.sin(t*.9)*.55,env:1,gl:.6};
  if(t<6){const k=ease((t-3)/.6);return {ext:1-k,holo:1-k,dep:0,rot:(1-k)*Math.sin(t*.9)*.55,env:1-k,gl:0}}
  if(t<9){const k=ease((t-6)/.8);return {ext:0,holo:0,dep:k,rot:0,env:0,gl:0}}
  if(t<12){const k=ease((t-9)/2.2);return {ext:k,holo:0,dep:1-ease((t-10.6)/1.2),rot:Math.sin((t-9)*1.1)*.6*k,env:0,gl:0}}
  if(t<18){const k=ease((t-12)/1);return {ext:1,holo:k,dep:0,rot:Math.sin((t-9)*1.1)*.6,env:k,gl:k*.7}}
  return {ext:1,holo:1,dep:0,rot:Math.sin((t-9)*1.1)*.6,env:1,gl:.7};
}
window.DRAW=t=>{
  document.getElementById("prog").style.width=Math.min(100,t/TOTAL*100)+"%";
  let ci=0;CAPS.forEach((c,i)=>{if(t>=c)ci=i});
  document.querySelectorAll("[data-c]").forEach((c,i)=>{const a=i===ci?(i===0?1:ease((t-CAPS[i])/.4)):0;c.style.opacity=a;c.style.transform=`translateY(${(1-a)*24}px)`});
  const s=state(t);
  U.uT.value=t;U.uExt.value=s.ext;U.uHolo.value=s.holo;U.uShowDepth.value=s.dep;U.uGlitch.value=s.gl;
  bust.rotation.y=s.rot; cam.position.x=Math.sin(t*.25)*.2;cam.lookAt(0,-.8,0);
  ringMats.forEach((m,i)=>m.opacity=s.env*(.25+.35*Math.max(0,Math.sin(t*2.2-i*.9))));
  plat.rotation.y=t*.25;
  waves.forEach(w=>{const n=200;for(let j=0;j<n;j++){const a=j/(n-1)*Math.PI*2,R=.9+w.i*.16;
      w.pa[j*3]=Math.cos(a)*R;w.pa[j*3+2]=Math.sin(a)*R;w.pa[j*3+1]=Math.sin(a*3+t*1.6+w.i*.7)*.06+w.i*.012}
    w.ln.geometry.attributes.position.needsUpdate=true;w.lm.opacity=s.env*(w.i===3?.9:.18)});
  cone.material.uniforms.uA.value=s.env;
  for(let i=0;i<PN;i++){const[a,r,o]=pr[i];const y=((o+t*.12)%1);pp[i*3]=Math.cos(a+t*.2)*r*.8;pp[i*3+1]=-1.35+y*3.6;pp[i*3+2]=Math.sin(a+t*.2)*r*.8}
  pg.attributes.position.needsUpdate=true; pm.opacity=s.env*.7;
  renderer.render(scene,cam);
};
window.READY=true;
</script>
</body></html>
