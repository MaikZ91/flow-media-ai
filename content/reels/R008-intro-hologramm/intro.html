<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#020308;color:#fff;font-family:Inter,sans-serif}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
.ov{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;background:#cfd9ff;opacity:0;mix-blend-mode:screen}
.word{position:absolute;left:0;right:0;top:1290px;text-align:center;font:700 230px/.9 Oswald;letter-spacing:.02em;text-transform:uppercase;opacity:0;color:#fff;
  text-shadow:0 0 30px rgba(47,91,255,.9),0 0 90px rgba(47,91,255,.6)}
.word span{color:#2F5BFF}
.welcome{position:absolute;left:0;right:0;top:1250px;text-align:center;opacity:0}
.welcome .w{font:500 34px Montserrat;letter-spacing:.6em;text-transform:uppercase;color:#bfcaff;padding-left:.6em}
.welcome img{display:block;width:760px;margin:34px auto 0;filter:drop-shadow(0 0 24px rgba(47,91,255,.9)) drop-shadow(0 0 60px rgba(47,91,255,.6))}
.welcome .v{margin-top:40px;font:500 26px Montserrat;letter-spacing:.42em;text-transform:uppercase;color:#fff;padding-left:.42em}
.welcome .v b{color:#2F5BFF;font-weight:600}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px);mix-blend-mode:screen}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.75) 100%)}
.gl1,.gl2{position:absolute;inset:0;opacity:0}
</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js"}}</script>
</head><body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div class="ov">
  <div class="vign"></div><div class="scan"></div>
  <div class="word" id="w0">Build<span>.</span></div>
  <div class="word" id="w1">Connect<span>.</span></div>
  <div class="word" id="w2">Enable<span>.</span></div>
  <div class="welcome" id="welcome"><div class="w">Welcome to</div><img src="logo_flow.png" alt=""><div class="v">Build <b>·</b> Connect <b>·</b> Enable</div></div>
  <div id="flash"></div>
</div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "./three/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "./three/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "./three/examples/jsm/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "./three/examples/jsm/postprocessing/ShaderPass.js";
import { OutputPass } from "./three/examples/jsm/postprocessing/OutputPass.js";

const W = 1080, H = 1920, TOTAL = 14; window.TOTAL = TOTAL;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x000000, .03);
const cam = new THREE.PerspectiveCamera(34, W / H, .05, 200);

// seeded randomness so every render is identical
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
const R = rng(7);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 };
const eo = x => 1 - Math.pow(1 - cl(x), 3);

const load = u => new Promise(r => new THREE.TextureLoader().load(u, t => { t.colorSpace = THREE.NoColorSpace; r(t) }));
const [photo, depth] = await Promise.all([load("photo.png"), load("depth.png")]);

// ---------- hologram point cloud: particles fly in from a vortex and assemble into Maik ----------
const GX = 300, GY = 400, N = GX * GY;
const pos = new Float32Array(N * 3), uv = new Float32Array(N * 2), rnd = new Float32Array(N), start = new Float32Array(N * 3);
for (let y = 0; y < GY; y++) for (let x = 0; x < GX; x++) {
  const i = y * GX + x, u = x / (GX - 1), v = 1 - y / (GY - 1);
  pos[i * 3] = (u - .5) * 2.4; pos[i * 3 + 1] = (v - .5) * 3.2; pos[i * 3 + 2] = 0; uv[i * 2] = u; uv[i * 2 + 1] = v; rnd[i] = R();
  const a = R() * Math.PI * 2, r = 2.5 + R() * 6, h = (R() - .5) * 10;
  start[i * 3] = Math.cos(a) * r; start[i * 3 + 1] = h; start[i * 3 + 2] = Math.sin(a) * r - 2;
}
const g = new THREE.BufferGeometry();
g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
g.setAttribute("rnd", new THREE.BufferAttribute(rnd, 1)); g.setAttribute("aStart", new THREE.BufferAttribute(start, 3));
const U = { uPhoto: { value: photo }, uDepth: { value: depth }, uT: { value: 0 }, uAsm: { value: 0 }, uGlitch: { value: 0 }, uPulse: { value: 0 }, uFade: { value: 1 } };
const holo = new THREE.Points(g, new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
  uniform sampler2D uPhoto,uDepth;uniform float uT,uAsm,uGlitch,uPulse;
  attribute float rnd;attribute vec3 aStart;
  varying float vL,vM,vY,vR,vK;
  void main(){
    float d=texture2D(uDepth,uv).r; vL=texture2D(uPhoto,uv).r; vR=rnd;
    vM=smoothstep(.30,.42,d)*smoothstep(.0,.14,uv.y);
    vec3 tgt=position; tgt.z=(d-.45)*1.45;
    // assemble bottom-up with a spiral
    float k=clamp(uAsm*1.9-(1.-uv.y)*.55-rnd*.35,0.,1.); k=k*k*(3.-2.*k); vK=k;
    float sw=(1.-k)*6.;
    vec3 s=aStart; s.xz=mat2(cos(sw),-sin(sw),sin(sw),cos(sw))*s.xz;
    vec3 p=mix(s,tgt,k);
    float slice=floor((tgt.y+uT*.8)*16.);
    float gj=step(.94,fract(sin(slice*91.7+floor(uT*14.)*13.1)*43758.5));
    p.x+=gj*uGlitch*(fract(sin(slice*7.1)*999.)-.5)*.5;
    p+=vec3(sin(uT*2.+rnd*40.),cos(uT*1.7+rnd*30.),sin(uT*1.3+rnd*20.))*.007;
    p+=normalize(vec3(p.xy,1.))*uPulse*.025*sin(rnd*30.+uT*20.);
    vec4 mv=modelViewMatrix*vec4(p,1.); vY=tgt.y;
    gl_PointSize=(1.9+1.8*(1.-k)+rnd*.6)*(10./-mv.z);
    gl_Position=projectionMatrix*mv;
  }`,
  fragmentShader: `
  uniform float uT,uFade;varying float vL,vM,vY,vR,vK;
  void main(){
    float r=length(gl_PointCoord-.5); if(r>.5) discard;
    float soft=smoothstep(.5,.0,r);
    float band=smoothstep(.05,0.,abs(fract(vY*.3-uT*.42)-.5)-.4);
    float lines=.86+.14*sin(vY*190.+uT*8.);
    vec3 blue=vec3(.16,.34,1.), ice=vec3(.82,.9,1.);
    vec3 c=(mix(blue*.8,ice,pow(vL,1.05))*lines+blue*band*1.8)*1.45;
    c=mix(vec3(.55,.68,1.)*1.2,c,vK);
    float a=mix(vM,.5,1.-vK)*soft*mix(.35,.04+.96*pow(vL,1.5),vK)*(.88+.12*sin(uT*45.+vR*7.))*uFade*.7;
    gl_FragColor=vec4(c*a,a);
  }`
}));
holo.position.y = .55; scene.add(holo);

// ---------- warp starfield ----------
const SN = 2600, sp = new Float32Array(SN * 3), sv = [];
for (let i = 0; i < SN; i++) { sv.push([(R() - .5) * 40, (R() - .5) * 60, -R() * 120]) }
const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x9fb4ff, size: .09, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(stars);
// streaks for the warp
const streakG = new THREE.BufferGeometry(), stp = new Float32Array(SN * 6);
streakG.setAttribute("position", new THREE.BufferAttribute(stp, 3));
const streaks = new THREE.LineSegments(streakG, new THREE.LineBasicMaterial({ color: 0x6f8cff, transparent: true, opacity: .8, blending: THREE.AdditiveBlending }));
scene.add(streaks);

// ---------- platform: rings + flowing waves ----------
const plat = new THREE.Group(); plat.position.y = -1.55; scene.add(plat);
const rings = [];
for (let i = 0; i < 6; i++) { const r = .8 + i * .3; const m = new THREE.MeshBasicMaterial({ color: i % 2 ? 0x2F5BFF : 0x9fb4ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(new THREE.RingGeometry(r, r + (i === 0 ? .03 : .012), 160), m); ring.rotation.x = -Math.PI / 2; plat.add(ring); rings.push(m) }
const disc = new THREE.Mesh(new THREE.CircleGeometry(1.1, 64), new THREE.MeshBasicMaterial({ color: 0x2F5BFF, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
disc.rotation.x = -Math.PI / 2; plat.add(disc);
const waves = [];
for (let i = 0; i < 9; i++) { const n = 240, pa = new Float32Array(n * 3), lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.BufferAttribute(pa, 3));
  const lm = new THREE.LineBasicMaterial({ color: i === 4 ? 0x5577ff : 0xcfd8ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
  const ln = new THREE.Line(lg, lm); scene.add(ln); waves.push({ pa, lm, ln, i }) }
// BUILD: wireframe grid floor
const grid = new THREE.GridHelper(14, 28, 0x2F5BFF, 0x2F5BFF); grid.position.y = -1.56; grid.material.transparent = true; grid.material.opacity = 0; grid.material.blending = THREE.AdditiveBlending; scene.add(grid);
// CONNECT: nodes orbiting the head with lines
const nodes = Array.from({ length: 10 }, (_, i) => ({ a: i / 10 * Math.PI * 2, r: 1.9 + (i % 3) * .25, y: -.4 + (i % 4) * .55 }));
const nodeG = new THREE.BufferGeometry(), np = new Float32Array(nodes.length * 3); nodeG.setAttribute("position", new THREE.BufferAttribute(np, 3));
const nodePts = new THREE.Points(nodeG, new THREE.PointsMaterial({ color: 0xffffff, size: .16, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(nodePts);
const linkG = new THREE.BufferGeometry(), lp = new Float32Array(nodes.length * 2 * 3 * 2); linkG.setAttribute("position", new THREE.BufferAttribute(lp, 3));
const links = new THREE.LineSegments(linkG, new THREE.LineBasicMaterial({ color: 0x6f8cff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })); scene.add(links);
// ENABLE: rising beam + particles
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.5, 1.4, 9, 64, 1, true), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, uniforms: { uA: { value: 0 }, uT: U.uT },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `uniform float uA,uT;varying vec2 vUv;void main(){float a=pow(1.-vUv.y,1.5)*.22*uA*(.7+.3*sin(vUv.x*80.+uT*4.));gl_FragColor=vec4(vec3(.25,.45,1.)*a,a);}`
})); beam.position.y = 2.9; scene.add(beam);
const RN = 1400, rp = new Float32Array(RN * 3), rr = []; for (let i = 0; i < RN; i++) rr.push([R() * Math.PI * 2, .3 + R() * 2.2, R()]);
const rg = new THREE.BufferGeometry(); rg.setAttribute("position", new THREE.BufferAttribute(rp, 3));
const rise = new THREE.Points(rg, new THREE.PointsMaterial({ color: 0xaabbff, size: .03, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(rise);

// ---------- lightning ----------
const boltPool = [];
function bolt(a, b, seed, depthLvl = 6) {
  const r = rng(seed); let pts = [a.clone(), b.clone()];
  let disp = a.distanceTo(b) * .22;
  for (let l = 0; l < depthLvl; l++) { const np = [];
    for (let i = 0; i < pts.length - 1; i++) { const m = pts[i].clone().lerp(pts[i + 1], .5); m.x += (r() - .5) * disp; m.y += (r() - .5) * disp * .5; m.z += (r() - .5) * disp; np.push(pts[i], m) }
    np.push(pts[pts.length - 1]); pts = np; disp *= .55 }
  // a few branches
  const extra = [];
  for (let k = 0; k < 3; k++) { const i = Math.floor(r() * pts.length * .7) + 2; if (!pts[i]) continue; const end = pts[i].clone().add(new THREE.Vector3((r() - .5) * 1.4, -r() * 1.2, (r() - .5) * 1.0)); extra.push([pts[i], end]) }
  return { pts, extra };
}
function addBolt(a, b, seed, intensity) {
  const { pts, extra } = bolt(a, b, seed);
  const mk = (arr, op, col) => { const ge = new THREE.BufferGeometry().setFromPoints(arr); const ln = new THREE.Line(ge, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: op, blending: THREE.AdditiveBlending })); scene.add(ln); boltPool.push(ln) };
  for (let j = 0; j < 3; j++) mk(pts.map(p => p.clone().add(new THREE.Vector3((j - 1) * .012, 0, 0))), intensity * (j === 1 ? 1 : .6), j === 1 ? 0xffffff : 0x8fa8ff);
  extra.forEach(([s, e]) => { const br = bolt(s, e, seed + 99, 4).pts; mk(br, intensity * .6, 0x8fa8ff) });
}
function clearBolts() { boltPool.forEach(l => { scene.remove(l); l.geometry.dispose(); l.material.dispose() }); boltPool.length = 0 }

// strikes: [time, from, to, strength]
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const STRIKES = [
  [0.55, V(-3, 9, -6), V(-1.2, -1.5, -3), .7],
  [1.15, V(.2, 10, 0), V(0, -1.55, 0), 1.2],
  [4.30, V(-2.4, 2.6, .4), V(-.9, 1.2, .3), .8],
  [5.20, V(2.5, 3.0, .2), V(.95, 1.6, .2), .8],
  [6.00, V(-.6, 10, 0), V(0, -1.55, 0), 1.1],
  [7.20, V(.6, 10, 0), V(0, -1.55, 0), 1.1],
  [8.40, V(0, 10, 0), V(0, -1.55, 0), 1.2],
  [10.4, V(-2.2, 10, -1), V(0, -1.55, 0), 1.4],
  [10.48, V(2.2, 10, -1), V(0, -1.55, 0), 1.2],
];
const BOLT_LEN = .22;

// ---------- post: bloom + chromatic aberration + grain ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .9, .35, .38); composer.addPass(bloom);
const fx = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uT: { value: 0 }, uCA: { value: .002 } },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `uniform sampler2D tDiffuse;uniform float uT,uCA;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+uT*7.)*43758.5453);}
  void main(){vec2 d=(vUv-.5)*uCA*2.;float r=texture2D(tDiffuse,vUv+d).r,g=texture2D(tDiffuse,vUv).g,b=texture2D(tDiffuse,vUv-d).b;
  vec3 c=vec3(r,g,b)*1.05-.012+(h(vUv*vec2(1080.,1920.))-.5)*.025;gl_FragColor=vec4(c,1.);}` });
composer.addPass(fx); composer.addPass(new OutputPass());

const words = [0, 1, 2].map(i => document.getElementById("w" + i)), welcome = document.getElementById("welcome"), flash = document.getElementById("flash");
const WORD_T = [6.0, 7.2, 8.4];

window.DRAW = t => {
  U.uT.value = t; fx.uniforms.uT.value = t;
  // camera: dolly in during assembly, slow orbit later
  const dolly = 13 - 4.2 * ease((t - .8) / 3.2);
  const orbit = t < 3.6 ? 0 : Math.sin((t - 3.6) * .55) * .2;
  cam.position.set(Math.sin(orbit) * dolly, .9 + Math.sin(t * .4) * .1, Math.cos(orbit) * dolly);
  cam.lookAt(0, .15, 0);
  // hologram
  U.uAsm.value = ease((t - 1.2) / 2.6);
  holo.rotation.y = t < 3.8 ? 0 : Math.sin((t - 3.8) * .9) * .32;
  U.uGlitch.value = t > 3.8 ? .8 : 0;
  // pulse on hits
  let pulse = 0; STRIKES.forEach(([ts, , , s]) => { if (t >= ts && t < ts + .5) pulse = Math.max(pulse, (1 - (t - ts) / .5) * s) }); U.uPulse.value = pulse;
  U.uFade.value = 1 - .3 * ease((t - 10.2) / .6);
  // warp stars (fast at start, settle later)
  const speed = t < 1.2 ? 2.2 : .25 + 1.6 * Math.max(0, 1 - (t - 1.2) / .8);
  for (let i = 0; i < SN; i++) { const s = sv[i]; let z = s[2] + t * 60 * (t < 1.2 ? 1 : 0) + (t >= 1.2 ? 72 + (t - 1.2) * 6 : 0); z = ((z + 120) % 130) - 120;
    sp[i * 3] = s[0]; sp[i * 3 + 1] = s[1]; sp[i * 3 + 2] = z;
    const len = speed * 1.8; stp[i * 6] = s[0]; stp[i * 6 + 1] = s[1]; stp[i * 6 + 2] = z; stp[i * 6 + 3] = s[0]; stp[i * 6 + 4] = s[1]; stp[i * 6 + 5] = z - len }
  sg.attributes.position.needsUpdate = true; streakG.attributes.position.needsUpdate = true;
  streaks.material.opacity = cl(1.3 - t * .9) * .9; stars.material.opacity = .35 + .65 * cl(1.4 - t * .5);
  // platform
  const env = ease((t - 1.15) / 1.2);
  rings.forEach((m, i) => m.opacity = env * (.25 + .5 * Math.max(0, Math.sin(t * 2.6 - i * .8))) * (1 + pulse));
  disc.material.opacity = env * (.08 + .25 * pulse);
  plat.rotation.y = t * .35;
  waves.forEach(w => { const n = 240; for (let j = 0; j < n; j++) { const a = j / (n - 1) * Math.PI * 2, Rr = 1.15 + w.i * .17;
      w.pa[j * 3] = Math.cos(a + t * .3 * (w.i % 2 ? 1 : -1)) * Rr; w.pa[j * 3 + 2] = Math.sin(a + t * .3 * (w.i % 2 ? 1 : -1)) * Rr;
      w.pa[j * 3 + 1] = -1.5 + Math.sin(a * 3 + t * 1.8 + w.i * .7) * (.08 + w.i * .012) + w.i * .02 }
    w.ln.geometry.attributes.position.needsUpdate = true; w.lm.opacity = env * (w.i === 4 ? 1 : .22) });
  // BUILD grid / CONNECT network / ENABLE beam
  const kb = ease((t - 6.0) / .6) * (1 - ease((t - 10.3) / .6) * .6);
  grid.material.opacity = kb * .35; grid.position.y = -1.56 - (1 - ease((t - 6) / .8)) * 1.5;
  const kc = ease((t - 7.2) / .6) * (1 - ease((t - 10.3) / .6) * .5);
  nodes.forEach((n, i) => { const a = n.a + t * .45; np[i * 3] = Math.cos(a) * n.r; np[i * 3 + 1] = n.y + .55 + Math.sin(t + i) * .08; np[i * 3 + 2] = Math.sin(a) * n.r });
  nodeG.attributes.position.needsUpdate = true; nodePts.material.opacity = kc;
  let li = 0; nodes.forEach((n, i) => { const j = (i + 1) % nodes.length, k = (i + 3) % nodes.length;
    [j, k].forEach(o => { lp[li++] = np[i * 3]; lp[li++] = np[i * 3 + 1]; lp[li++] = np[i * 3 + 2]; lp[li++] = np[o * 3]; lp[li++] = np[o * 3 + 1]; lp[li++] = np[o * 3 + 2] }) });
  linkG.attributes.position.needsUpdate = true; links.material.opacity = kc * .55;
  const ke = ease((t - 8.4) / .6);
  beam.material.uniforms.uA.value = ke * (1 + pulse * .5) * (1 - .5 * ease((t - 10.6) / 1));
  for (let i = 0; i < RN; i++) { const [a, r, o] = rr[i]; const y = (o + t * .18) % 1; rp[i * 3] = Math.cos(a + t * .25) * r * (1 - y * .4); rp[i * 3 + 1] = -1.5 + y * 6; rp[i * 3 + 2] = Math.sin(a + t * .25) * r * (1 - y * .4) }
  rg.attributes.position.needsUpdate = true; rise.material.opacity = Math.max(ke, env * .25) * .8;
  // lightning (flicker every frame within the strike window)
  clearBolts(); let fl = 0;
  STRIKES.forEach(([ts, a, b, s], k) => { const dt = t - ts; if (dt >= 0 && dt < BOLT_LEN) { const flick = Math.floor(dt * 30); addBolt(a, b, k * 100 + flick, s * (1 - dt / BOLT_LEN * .5)); fl = Math.max(fl, s * (1 - dt / BOLT_LEN)) } });
  flash.style.opacity = Math.min(.22, fl * .18);
  bloom.strength = .85 + fl * .9 + pulse * .25;
  fx.uniforms.uCA.value = .0015 + fl * .006 + pulse * .002;
  // words
  words.forEach((w, i) => { const dt = t - WORD_T[i], end = i < 2 ? WORD_T[i + 1] - WORD_T[i] : 1.8;
    const a = dt < 0 ? 0 : dt < .08 ? dt / .08 : dt > end - .15 ? cl((end - dt) / .15) : 1;
    w.style.opacity = a; const s = 1.25 - .25 * eo(dt / .35); const jx = dt < .25 ? (Math.sin(dt * 180) * 18 * (1 - dt / .25)) : 0;
    w.style.transform = `translateX(${jx}px) scale(${s})`;
    w.style.textShadow = `${-6 * (1 - cl(dt / .3))}px 0 rgba(255,40,80,.7), ${6 * (1 - cl(dt / .3))}px 0 rgba(40,200,255,.7), 0 0 30px rgba(47,91,255,.9), 0 0 90px rgba(47,91,255,.6)` });
  const dw = t - 10.4; const aw = dw < 0 ? 0 : eo(dw / .5);
  welcome.style.opacity = aw; welcome.style.transform = `translateY(${(1 - aw) * 30}px) scale(${1.08 - .08 * aw})`;
  composer.render();
};
window.READY = true;
</script>
</body></html>
