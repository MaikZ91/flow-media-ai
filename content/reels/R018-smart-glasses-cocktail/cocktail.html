<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--blue:#2F5BFF}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0B;color:#fff;font-family:Inter,sans-serif}
canvas{position:absolute;inset:0}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(11,11,11,.85) 0%,rgba(11,11,11,.3) 24%,rgba(11,11,11,0) 38%,rgba(11,11,11,0) 76%,rgba(11,11,11,.5) 100%)}
.prog{position:absolute;left:76px;right:76px;top:64px;height:3px;background:rgba(255,255,255,.18);z-index:20}
.prog i{display:block;height:100%;background:#fff;width:0}
.logo{position:absolute;left:76px;top:110px;width:170px;z-index:10}
.konz{position:absolute;left:280px;top:118px;font:600 20px Montserrat;letter-spacing:.2em;color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 14px;z-index:10}
.av{position:absolute;right:56px;top:84px;width:230px;z-index:10;opacity:0}
.txt{position:absolute;left:76px;right:76px;top:300px;z-index:12}
.k{font:500 28px Montserrat;letter-spacing:.2em;color:#e6e6e6;text-transform:uppercase}
.h{margin-top:16px;font:700 108px/.94 Oswald;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.s{margin-top:22px;font:400 38px/1.35 Inter;color:#e6e6e6;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.b{color:var(--blue)}
/* HUD (what you see through the glasses) */
.hud{position:absolute;inset:0;z-index:15;opacity:0;pointer-events:none}
.hud .frame{position:absolute;left:40px;right:40px;top:220px;bottom:300px;border-radius:60px;box-shadow:inset 0 0 120px rgba(47,91,255,.25);border:2px solid rgba(47,91,255,.35)}
.hud .panel{position:absolute;left:90px;top:280px;width:640px;padding:30px 36px;border-radius:26px;background:rgba(8,12,30,.55);border:1.5px solid rgba(120,150,255,.45);backdrop-filter:blur(4px)}
.hud .step{font:500 26px 'JetBrains Mono',monospace;color:#9fb4ff;letter-spacing:.06em}
.hud .ins{margin-top:12px;font:700 84px/.95 Oswald;text-transform:uppercase}
.hud .sub{margin-top:12px;font:400 30px Inter;color:#d7defa}
.hud .ring{position:absolute;right:90px;top:300px;width:240px;height:240px}
.hud .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hud .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font:700 70px/1 Oswald}
.hud .ring .val small{font:500 22px Montserrat;letter-spacing:.14em;color:#9fb4ff;margin-top:6px}
.hud .voice{position:absolute;left:90px;bottom:340px;display:flex;align-items:center;gap:20px;padding:22px 30px;border-radius:40px;background:rgba(8,12,30,.55);border:1.5px solid rgba(120,150,255,.4)}
.hud .voice .w{display:flex;gap:6px;align-items:center;height:40px}
.hud .voice .w i{display:block;width:6px;border-radius:3px;background:#9fb4ff}
.hud .voice span{font:400 30px Inter;color:#e8ecff}
.hud .rec{position:absolute;right:90px;bottom:350px;display:flex;align-items:center;gap:12px;font:600 26px Montserrat;letter-spacing:.14em}
.hud .rec i{width:20px;height:20px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 16px #ff3b3b}
.hud .steps{position:absolute;left:90px;right:90px;top:240px;display:flex;gap:10px}
.hud .steps i{flex:1;height:6px;border-radius:3px;background:rgba(159,180,255,.25)}
.hud .steps i.on{background:#9fb4ff}
/* feature list */
.feat{position:absolute;left:76px;right:76px;top:1080px;z-index:12;opacity:0}
.feat div{display:flex;align-items:center;gap:26px;padding:24px 28px;margin-bottom:16px;border-radius:22px;background:rgba(11,11,11,.72);border:1.5px solid rgba(255,255,255,.14);opacity:0}
.feat b{display:inline-flex;width:66px;height:66px;border-radius:50%;background:var(--blue);align-items:center;justify-content:center;font:700 30px Oswald;flex:none}
.feat span{font:600 40px Inter}.feat small{display:block;font:400 28px Inter;color:#cfcfcf;margin-top:4px}
.cta{position:absolute;left:76px;right:76px;top:1560px;font:500 36px Inter;z-index:12;opacity:0;text-shadow:0 3px 14px rgba(0,0,0,.7)}
</style>
