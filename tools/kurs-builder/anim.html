<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../flow-dna/kurse/website-mit-skill/fonts/fonts.css">
<style>
:root{--ink:#0B0B0B;--w:#F4F4F1;--mute:#9A9A9A;--blue:#2F5BFF;--line:rgba(244,244,241,.85)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:800px;overflow:hidden;background:var(--ink);color:var(--w);font-family:Inter,sans-serif}
#top{position:absolute;left:64px;right:64px;top:40px;display:flex;justify-content:space-between;align-items:center}
#wm{display:flex;align-items:center;gap:12px;font:700 20px Oswald;letter-spacing:.04em;text-transform:uppercase}
#crumb{font:600 12px Montserrat;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
#stage{position:absolute;left:64px;right:64px;top:110px;height:560px}
#sub{position:absolute;left:120px;right:120px;bottom:44px;text-align:center;font:500 24px/1.4 Inter;color:var(--w);min-height:68px;display:flex;align-items:center;justify-content:center}
#prog{position:absolute;left:0;bottom:0;height:5px;background:var(--blue)}
.sc{position:absolute;inset:0;opacity:0}
.k{font:600 13px Montserrat;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-bottom:18px}
.h{font:700 118px/.9 Oswald;text-transform:uppercase}.h b{color:var(--blue);font-weight:700}
.h.m{font-size:84px}.h.s{font-size:60px}
.cards{display:grid;gap:22px;position:absolute;left:0;right:0;top:150px}
.card{border:2px solid var(--line);padding:26px 26px 30px;min-height:210px}
.card i{font:700 56px/1 Oswald;font-style:normal;color:var(--blue);display:block}
.card b{display:block;font:700 34px/1.02 Oswald;text-transform:uppercase;margin:12px 0 10px}
.card span{font-size:18px;line-height:1.4;color:#c9c9c4}
.chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.chip{border:2px solid var(--line);padding:12px 20px;font:600 22px Montserrat;letter-spacing:.08em;text-transform:uppercase}
.chip.on{background:var(--blue);border-color:var(--blue)}
.win{position:absolute;left:0;top:120px;width:790px;border:2px solid var(--line);background:#151515}
.win .bar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(244,244,241,.25);font:400 14px "JetBrains Mono",monospace;color:var(--mute)}
.win .bar u{width:11px;height:11px;border-radius:50%;background:#555;display:block}
.win pre{padding:24px 26px;font:400 23px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;min-height:230px}
.win pre em{font-style:normal;color:var(--blue)}
.side{position:absolute;right:0;top:120px;width:330px}
.side .card{min-height:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:26px;position:absolute;left:0;right:0;top:130px}
.vs>div{border:2px solid rgba(244,244,241,.4);padding:26px}
.vs>div.g{border-color:var(--blue)}
.vs small{font:600 13px Montserrat;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.vs .g small{color:var(--blue)}
.vs b{display:block;font:700 40px/1 Oswald;text-transform:uppercase;margin:10px 0 16px}
.vs p{font-size:20px;line-height:1.45;padding:9px 0;border-top:1px solid rgba(244,244,241,.18);color:#d5d5d0}
.list{position:absolute;left:0;top:150px;width:900px}
.li{display:flex;gap:18px;align-items:center;padding:17px 0;border-top:1px solid rgba(244,244,241,.25);font-size:27px}
.li i{flex:none;width:38px;height:38px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font:700 22px Oswald;color:var(--ink)}
.li.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.steps{display:grid;gap:14px;position:absolute;left:0;right:0;top:170px}
.st{border:2px solid var(--line);padding:22px 16px;text-align:center;position:relative}
.st i{font:700 44px Oswald;font-style:normal;color:var(--mute)}
.st b{display:block;font:700 26px/1.05 Oswald;text-transform:uppercase;margin-top:8px}
.st.on{border-color:var(--blue)}.st.on i{color:var(--blue)}
.track{position:absolute;left:0;right:0;top:140px;height:4px;background:rgba(244,244,241,.2)}.track u{display:block;height:100%;background:var(--blue)}
.stamp{position:absolute;right:40px;top:210px;font:700 74px Oswald;text-transform:uppercase;color:var(--blue);border:7px solid var(--blue);padding:8px 26px;transform:rotate(-8deg)}
.pic{position:absolute;right:0;top:0;width:330px;height:470px;border:2px solid var(--line);background:url(../../flow-dna/kurse/website-mit-skill/img/maik_front.jpg) center 20%/cover;filter:grayscale(1)}
.big{font:700 190px/.85 Oswald;color:var(--blue)}
</style></head><body>
<div id="top"><div id="wm"><svg width="34" height="18" viewBox="0 0 34 18"><path d="M1 9 C6 -3 11 21 17 9 S28 -3 33 9" fill="none" stroke="#2F5BFF" stroke-width="2.4"/><path d="M1 9 C6 21 11 -3 17 9 S28 21 33 9" fill="none" stroke="#F4F4F1" stroke-width="2"/></svg>Flow DNA</div><div id="crumb"></div></div>
<div id="stage"></div><div id="sub"></div><div id="prog"></div>
<script>
// SCENES = [{k, start, dur, say, ...}], CRUMB set by build.py via window.__DATA
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),out=x=>1-Math.pow(1-x,3),back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const hl=s=>esc(s).replace(/\*([^*]+)\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
const inn=(el,p,dy=26)=>{const q=out(cl(p));el.style.opacity=q;el.style.transform=`translateY(${(1-q)*dy}px)`};
const TPL={
 title:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="h${s.size?" "+s.size:""}">${hl(s.h)}</div>${s.pic?'<div class="pic"></div>':""}`,
 cards:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="h s">${hl(s.h||"")}</div><div class="cards" style="grid-template-columns:repeat(${s.items.length},1fr)">${s.items.map(c=>`<div class="card"><i>${esc(c[0])}</i><b>${esc(c[1])}</b><span>${esc(c[2]||"")}</span></div>`).join("")}</div>`,
 chips:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="h m">${hl(s.h)}</div><div class="chips">${s.items.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`,
 prompt:s=>`<div class="k">${esc(s.kicker||"Dein Prompt")}</div><div class="h s">${hl(s.h||"")}</div><div class="win"><div class="bar"><u></u><u></u><u></u>${esc(s.bar||"claude")}</div><pre></pre></div>${s.note?`<div class="side"><div class="card"><i>→</i><b>${esc(s.note[0])}</b><span>${esc(s.note[1])}</span></div></div>`:""}`,
 tree:s=>`<div class="k">${esc(s.kicker||"So sieht's aus")}</div><div class="h s">${hl(s.h||"")}</div><div class="win"><div class="bar"><u></u><u></u><u></u>${esc(s.bar||"ordner")}</div><pre></pre></div>${s.note?`<div class="side"><div class="card"><i>→</i><b>${esc(s.note[0])}</b><span>${esc(s.note[1])}</span></div></div>`:""}`,
 vs:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="h s">${hl(s.h||"")}</div><div class="vs"><div><small>${esc(s.a[0])}</small><b>${esc(s.a[1])}</b>${s.a[2].map(x=>`<p>${esc(x)}</p>`).join("")}</div><div class="g"><small>${esc(s.b[0])}</small><b>${esc(s.b[1])}</b>${s.b[2].map(x=>`<p>${esc(x)}</p>`).join("")}</div></div>`,
 list:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="h s">${hl(s.h||"")}</div><div class="list">${s.items.map(x=>`<div class="li"><i>✓</i><span>${esc(x)}</span></div>`).join("")}</div>`,
 steps:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="h s">${hl(s.h||"")}</div><div class="track"><u></u></div><div class="steps" style="grid-template-columns:repeat(${s.items.length},1fr)">${s.items.map((x,i)=>`<div class="st"><i>${String(i+1).padStart(2,"0")}</i><b>${esc(x)}</b></div>`).join("")}</div>`,
 stamp:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="h">${hl(s.h)}</div><div class="stamp">${esc(s.stamp)}</div>`,
 num:s=>`<div class="k">${esc(s.kicker||"")}</div><div class="big">${esc(s.num)}</div><div class="h s" style="margin-top:18px">${hl(s.h)}</div>`
};
const DRAWS={
 title(el,p,s,t){inn(el.children[0],t/.3);inn(el.children[1],(t-.1)/.4,40);if(s.pic)inn(el.children[2],(t-.3)/.4,0)},
 cards(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.35);[...el.querySelectorAll(".card")].forEach((c,i)=>{const a=.5+i*(d-1.6)/s.items.length;const q=cl((t-a)/.3);c.style.opacity=q;c.style.transform=`scale(${.9+.1*back(q)})`;c.style.borderColor=t>a&&t<a+(d-1.6)/s.items.length?"#2F5BFF":""})},
 chips(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.4,40);[...el.querySelectorAll(".chip")].forEach((c,i)=>{const a=.7+i*(d-1.8)/s.items.length;const q=cl((t-a)/.22);c.style.opacity=q;c.style.transform=`scale(${.8+.2*back(q)})`;c.classList.toggle("on",(s.on||[]).includes(i)&&t>a+.3)})},
 prompt(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.35);const w=el.querySelector(".win");inn(w,(t-.3)/.35,30);const n=Math.floor(cl((t-.8)/Math.max(1,d-2.6))*s.text.length);w.querySelector("pre").innerHTML=esc(s.text.slice(0,n))+(n<s.text.length||Math.floor(t*2)%2?"<em>▍</em>":"");const sd=el.querySelector(".side");if(sd)inn(sd,(t-(d-1.6))/.35,20)},
 tree(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.35);const w=el.querySelector(".win");inn(w,(t-.3)/.35,30);const L=s.text.split("\n"),n=Math.floor(cl((t-.7)/Math.max(1,d-2.4))*L.length+.999);w.querySelector("pre").innerHTML=L.slice(0,n).map(x=>esc(x).replace(/(←.*)$/,"<em>$1</em>")).join("\n");const sd=el.querySelector(".side");if(sd)inn(sd,(t-(d-1.6))/.35,20)},
 vs(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.35);const [a,b]=el.querySelectorAll(".vs>div");inn(a,(t-.5)/.35);inn(b,(t-d*.45)/.35);[...a.querySelectorAll("p")].forEach((x,i)=>x.style.opacity=cl((t-.9-i*.5)/.3));[...b.querySelectorAll("p")].forEach((x,i)=>x.style.opacity=cl((t-d*.45-.4-i*.5)/.3))},
 list(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.35);[...el.querySelectorAll(".li")].forEach((c,i)=>{const a=.6+i*(d-1.6)/s.items.length;inn(c,(t-a)/.3,16);c.classList.toggle("on",t>a+.35)})},
 steps(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.35);const n=s.items.length;el.querySelector(".track u").style.width=(cl((t-.6)/(d-1.6))*100)+"%";[...el.querySelectorAll(".st")].forEach((c,i)=>{const a=.6+i*(d-1.6)/n;inn(c,(t-.3-i*.08)/.3,16);c.classList.toggle("on",t>a)})},
 stamp(el,p,s,t,d){inn(el.children[0],t/.3);inn(el.children[1],t/.4,40);const st=el.querySelector(".stamp"),q=cl((t-d*.5)/.22);st.style.opacity=q;st.style.transform=`rotate(-8deg) scale(${2-back(q)})`},
 num(el,p,s,t){inn(el.children[0],t/.3);const q=cl(t/.4);el.children[1].style.opacity=q;el.children[1].style.transform=`scale(${.7+.3*back(q)})`;el.children[1].style.transformOrigin="left center";inn(el.children[2],(t-.4)/.4)}
};
let S=[],els=[];
window.LOAD=d=>{S=d.scenes;document.getElementById("crumb").textContent=d.crumb;const st=document.getElementById("stage");st.innerHTML="";els=S.map(s=>{const e=document.createElement("div");e.className="sc";e.innerHTML=TPL[s.k](s);st.appendChild(e);return e});window.TOTAL=d.total};
window.DRAW=t=>{S.forEach((s,i)=>{const e=els[i],lt=t-s.start;if(lt<0||lt>=s.dur){e.style.opacity=0;return}e.style.opacity=Math.min(1,cl((s.dur-lt)/.25));DRAWS[s.k](e,lt/s.dur,s,lt,s.dur)});
 const c=S.find(s=>t>=s.start&&t<s.start+s.dur);document.getElementById("sub").textContent=c?c.say:"";document.getElementById("prog").style.width=(1280*t/window.TOTAL)+"px"};
</script></body></html>
