<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F4F1;--ink:#0B0B0B;--mute:#6B6B66;--blue:#2F5BFF}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--paper)}
.p{width:1080px;height:1350px;padding:70px;display:flex;flex-direction:column;gap:44px;color:var(--ink);font-family:Inter,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center}.top img{width:150px;filter:invert(1)}
.lab{font:600 22px Montserrat;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
h1{font:700 230px/.86 Oswald;text-transform:uppercase;letter-spacing:-.01em}h1 em{font-style:normal;color:var(--blue)}
.row{display:flex;gap:40px;flex:1;min-height:0}
.txt{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.k{font:600 20px Montserrat;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}.k.b{color:var(--blue)}
.t{font:700 52px/1.05 Oswald;text-transform:uppercase}.t em{font-style:normal;color:var(--blue)}
.line{height:3px;background:var(--ink);width:80px}
.maik{flex:none;width:360px;background:url(../img/maik_front.jpg) center 28%/cover;filter:grayscale(1) contrast(1.05);border:3px solid var(--ink);position:relative}
.maik span{position:absolute;left:0;bottom:0;background:var(--ink);color:#fff;font:600 19px Montserrat;letter-spacing:.14em;text-transform:uppercase;padding:12px 16px}
.cta{background:var(--ink);color:#fff;font:700 48px/1 Oswald;text-transform:uppercase;padding:30px 34px;display:flex;justify-content:space-between}.cta em{font-style:normal;color:var(--blue)}
</style></head><body><div class="p">
 <div class="top"><img src="../img/logo_flow.png"><span class="lab">Für Gründer &amp; Selbstständige</span></div>
 <h1>Lost<br>mit <em>KI?</em></h1>
 <div class="row">
  <div class="txt">
   <div><p class="k">Das Problem</p><p class="t">Zu viele Tools. Kein Plan, wo du anfangen sollst.</p></div>
   <div class="line"></div>
   <div><p class="k b">Die Lösung</p><p class="t">Lern es nicht allein. <em>Vernetz dich mit anderen.</em></p></div>
  </div>
  <div class="maik"><span>Maik · Gastgeber</span></div>
 </div>
 <div class="cta"><span>Flow Business <em>Community</em></span><span>Kostenlos →</span></div>
</div></body></html>
