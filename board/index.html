<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body>
<title>Flow Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Flow Media AI brand, same system as the landing page: calm off-white ground, Flow blue as the only accent,
   Bricolage Grotesque for the wordmark, titles and big numbers, IBM Plex Sans for the interface, Plex Mono for labels and times.
   Layout: white header with logo and view tabs; lists as soft columns with white cards; views as white panels. */
:root {
  --bg: #f6f6f2; --list: #ecede7; --card: #ffffff; --modal: #ffffff; --hover: #eef0ea; --line: #dfe1db;
  --ink: #121512; --muted: #5b625c; --faint: #7c837d;
  --accent: #2f5bff; --accent-ink: #ffffff; --soft: #e8ecff;
  --bar: #ffffff; --bar-ink: #121512; --scrim: rgba(18, 21, 18, .45);
  --red: #c9372c; --red-soft: #ffe2df; --ok: #1f845a; --warn: #e2b203; --on-status: #ffffff; --label-ink: #121512;
  --toast-bg: #121512; --toast-ink: #f6f6f2; --toast-act: #9db0ff;
  --c-in: #2f5bff; --c-out: #d97706;
  --shadow: 0 1px 2px rgba(18, 21, 18, .06); --lift: 0 24px 48px -12px rgba(18, 21, 18, .28), 0 0 0 1px rgba(18, 21, 18, .06);
  --l1: #f87168; --l2: #fea362; --l3: #e2b203; --l4: #8590a2;
  --la: #6cc3e0; --lb: #94c748; --lc: #9f8fef; --ld: #e774bb; --le: #579dff; --lf: #4bce97; --lg: #b38600;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1210; --list: #151916; --card: #1b201c; --modal: #171b18; --hover: #232924; --line: #2a302b;
  --ink: #ecefea; --muted: #a3aba4; --faint: #7d857e;
  --accent: #7d97ff; --accent-ink: #0f1210; --soft: #1d2440;
  --bar: #131714; --bar-ink: #ecefea; --scrim: rgba(0, 0, 0, .6);
  --red: #f0897d; --red-soft: #3b1d1a; --ok: #6cc59a; --warn: #e2b85a; --on-status: #0f1210; --label-ink: #121512;
  --toast-bg: #ecefea; --toast-ink: #0f1210; --toast-act: #2f5bff;
  --c-in: #5b7cf5; --c-out: #c98118;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --lift: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .05);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1210; --list: #151916; --card: #1b201c; --modal: #171b18; --hover: #232924; --line: #2a302b;
  --ink: #ecefea; --muted: #a3aba4; --faint: #7d857e;
  --accent: #7d97ff; --accent-ink: #0f1210; --soft: #1d2440;
  --bar: #131714; --bar-ink: #ecefea; --scrim: rgba(0, 0, 0, .6);
  --red: #f0897d; --red-soft: #3b1d1a; --ok: #6cc59a; --warn: #e2b85a; --on-status: #0f1210; --label-ink: #121512;
  --toast-bg: #ecefea; --toast-ink: #0f1210; --toast-act: #2f5bff;
  --c-in: #5b7cf5; --c-out: #c98118;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --lift: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .05);
  color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: #2a6f74; color: var(--ink); font: 14px/1.4 var(--f-body); display: flex; flex-direction: column; overflow: hidden }
#bg { position: fixed; inset: 0; z-index: -1; background: #2a6f74 center/cover no-repeat }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }

/* top bar */
.bar { background: var(--bar); backdrop-filter: blur(6px); color: var(--bar-ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)) }
.bbtn { background: rgba(255,255,255,.16); border: 0; color: inherit; border-radius: 6px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap }
.bbtn:hover { background: rgba(255,255,255,.28) }
.bbtn[aria-pressed="true"] { background: rgba(255,255,255,.9); color: #172b4d }
.bbtn.plain { background: none }
.bbtn.plain:hover { background: rgba(255,255,255,.2) }
.title { font-weight: 700; font-size: 18px; padding: 4px 8px; border-radius: 6px; border: 0; background: none; color: inherit; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.title:hover { background: rgba(255,255,255,.2) }
.title-input { font-weight: 700; font-size: 18px; padding: 3px 7px; border-radius: 6px; border: 0; color: #172b4d; width: min(320px, 60vw) }
.avatars { display: flex; padding-left: 6px }
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 11px var(--f-body); color: #fff; border: 2px solid rgba(255,255,255,.85); margin-left: -6px; flex: none }
.spacer { flex: 1 }
.sep { width: 1px; height: 20px; background: rgba(255,255,255,.3) }

/* board */
.surface { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; display: flex; align-items: flex-start; gap: 12px;
  padding-block: 12px 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  scroll-snap-type: x proximity; scroll-padding-inline: 12px }
.list { flex: 1 1 0; min-width: 0; max-height: 100%; background: var(--list); border-radius: 12px; display: flex; flex-direction: column; box-shadow: var(--shadow); scroll-snap-align: start }
.list-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 6px 14px; gap: 6px }
.list-head h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink) }
.list-head .n { font: 500 12px var(--f-mono); color: var(--faint) }
.dots { border: 0; background: none; color: var(--muted); border-radius: 6px; padding: 2px 8px; font-weight: 700; letter-spacing: 1px }
.dots:hover { background: var(--hover) }
.cards { overflow-y: auto; padding: 2px 8px 2px; display: flex; flex-direction: column; gap: 8px; min-height: 8px }
.cards.over { background: rgba(47,91,255,.12); border-radius: 8px }
.list-foot { padding: 6px 8px 8px }
.add { width: 100%; border: 0; background: none; color: var(--muted); text-align: left; border-radius: 8px; padding: 7px 8px; display: flex; gap: 6px; align-items: center; font-weight: 500 }
.add:hover { background: var(--hover); color: var(--ink) }
.composer textarea { width: 100%; border: 0; border-radius: 8px; padding: 8px 10px; background: var(--card); box-shadow: var(--shadow); resize: none; min-height: 60px }
.composer .row { display: flex; gap: 6px; margin-top: 6px; align-items: center }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600 }
.btn-x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 8px; border-radius: 6px }
.btn-x:hover { background: var(--hover) }

.card { background: var(--card); border-radius: 8px; box-shadow: var(--shadow); padding: 7px 9px 5px; display: flex; flex-direction: column; gap: 5px; text-align: left; border: 0; width: 100%; color: var(--ink); cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; flex: none }
[hidden] { display: none !important }
.drag-ghost { position: fixed; z-index: 40; pointer-events: none; transform: rotate(3deg); box-shadow: 0 12px 24px rgba(9,30,66,.3); opacity: .95; margin: 0 }
body.is-dragging, body.is-dragging * { cursor: grabbing !important }
.card:hover { outline: 2px solid var(--accent); outline-offset: -2px }
.card.dragging { opacity: .4; transform: rotate(2deg) }
.card .t { overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.3 }
.card.done .t { color: var(--faint) }
.labels { display: flex; gap: 4px; flex-wrap: wrap }
.lab { height: 8px; min-width: 40px; border-radius: 4px; background: var(--lc, var(--l4)) }
.labels.wide .lab { height: auto; min-width: 0; padding: 2px 8px; font: 600 11.5px/1.4 var(--f-body); color: #172b4d }
.foot { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 4px }
.badge.late { background: var(--red); color: #fff }
.badge.soon { background: #f5cd47; color: #172b4d }
.badge.done { background: #1f845a; color: #fff }
.foot .people { margin-left: auto; display: flex; padding-left: 6px }
.foot .av { width: 26px; height: 26px; border-color: var(--card); font-size: 10.5px }

/* matrix + calendar sit on the same background, as panels */
.panel { background: var(--list); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; min-width: 0 }
.matrix { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; align-self: stretch; min-height: 0 }
.quad { display: flex; flex-direction: column; gap: 6px; border-top: 5px solid var(--qc); min-height: 0 }
.quad .cards { flex: 1; min-height: 0 }
.quad h2 { margin: 0; font-size: 15px }
.quad p { margin: 0; color: var(--muted); font-size: 12.5px }
.cal-panel { flex: 1; align-self: stretch; overflow: hidden; display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.cal-head h2 { margin: 0 6px; font-size: 18px; min-width: 170px }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 10px; font-weight: 500 }
.cal-body { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 230px; gap: 12px; min-height: 0 }
.cal-scroll { overflow-x: auto; min-height: 0; display: flex }
.undated { min-height: 0; overflow: hidden }
.undated .cards { flex: 1; min-height: 0; overflow-y: auto }
.cal { flex: 1; display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: minmax(0, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0 }
.cal .h { background: var(--list); padding: 6px; font: 500 11.5px var(--f-mono); color: var(--faint); text-transform: uppercase }
.cal .kw { background: var(--list); padding: 8px 2px; text-align: center; font: 500 11px var(--f-mono); color: var(--faint) }
.day { background: var(--card); min-height: 0; padding: 4px; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-y: auto }
.day.out { opacity: .55 }
.day.over { background: var(--hover) }
.dn { display: flex; justify-content: space-between; font: 500 12px var(--f-mono); color: var(--muted) }
.day.today .dn span { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 7px }
.dadd { border: 0; background: none; color: var(--faint); border-radius: 4px; padding: 0 5px }
.dadd:hover { background: var(--hover) }
.pill { border: 0; text-align: left; border-radius: 4px; padding: 3px 6px; font-size: 12px; background: var(--pc); color: #172b4d; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100% }
.pill.done { opacity: .5; text-decoration: line-through }
.ptime { font-family: var(--f-mono); font-weight: 500; margin-right: 4px }
.kpis.five { grid-template-columns: repeat(5, minmax(0, 1fr)) }
.kpi.neg b { color: var(--red) } .kpi.accent b { color: var(--accent) }
.fin-tools { display: flex; gap: 8px; align-items: center }
.fin-tools select { border: 0; background: transparent; font-weight: 600 }
.fin-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.fin-form input, .fin-form select { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 6px 8px; min-width: 0 }
.fin-form input[name="title"] { flex: 1 1 200px }
.fin-form input[name="amount"] { width: 110px }
.tbl { overflow-x: auto }
.tbl table { width: 100%; border-collapse: collapse; font-size: 13px }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line) }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
.tbl td small { display: block; color: var(--faint) }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.tbl .pos { color: var(--ink) } .tbl .neg { color: var(--muted) }
.chipbtn { border: 0; border-radius: 99px; padding: 2px 8px; font-size: 12px; background: var(--hover); color: var(--muted) }
.chipbtn.open { background: #f5cd47; color: #172b4d; cursor: pointer; font-weight: 600 }
.meter-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px }
.mr-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; gap: 8px }
.mr-n { font-variant-numeric: tabular-nums; color: var(--muted) }
.mbar { height: 10px; background: var(--hover); border-radius: 5px; overflow: hidden } .mbar i { display: block; height: 100%; background: var(--accent) } .mbar.warn i { background: #e2b203 }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted) } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px }
.enlbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px }
.enl-E { background: var(--c-in) } .enl-N { background: var(--c-out) } .enl-L { background: var(--l4) }
span.enl { display: inline-block; color: #fff; border-radius: 4px; padding: 0 5px; font: 600 11px var(--f-mono) }
.chipbtn.miss { background: var(--red-soft); color: var(--red); cursor: pointer; font-weight: 600 }
.fl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0 }
.fl input, .fl select { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 6px 8px; color: var(--ink); font-weight: 400; width: 100% }
.inv-prof { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px }
.inv-prof .mini, .inv-prof .btn { grid-column: 1 / -1; justify-self: start }
.modal.inv-modal { grid-template-columns: minmax(0, 1fr); width: min(820px, 100%); gap: 14px }
.inv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.inv-item { display: flex; gap: 6px; margin-bottom: 6px }
.inv-item input { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 6px 8px; min-width: 0 }
.inv-item input[name="desc"] { flex: 1 }
.inv-frame { width: 100%; height: min(72vh, 900px); border: 1px solid var(--line); border-radius: 8px; background: #fff }
.ract { display: flex; gap: 4px; justify-content: flex-end; align-items: center }
.finnote { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.finnote ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px }
.finnote > p { grid-column: 1 / -1 }
@media (max-width: 900px) { .kpis.five { grid-template-columns: repeat(2, minmax(0, 1fr)) } .finnote { grid-template-columns: minmax(0, 1fr) } [style*="span 2"] { grid-column: auto !important } }
.stats { flex: 1; align-self: stretch; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0 }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi { background: var(--card); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.kpi .kl { font-size: 12.5px; color: var(--muted); font-weight: 500 }
.kpi b { font: 600 28px/1.15 var(--f-body); font-variant-numeric: tabular-nums }
.kd { font-size: 12px; color: var(--faint) } .kd.up { color: #1f845a } .kd.down { color: var(--red) }
.sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.spanel { background: var(--card); display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.spanel.wide { grid-column: 1 / -1 }
.spanel h3 { margin: 0; font-size: 14px }
.chart { position: relative }
.chart svg { width: 100%; height: auto; display: block; overflow: visible }
.chart .gl { stroke: var(--line); stroke-width: 1 } .chart .ax { fill: var(--faint); font: 500 10px var(--f-mono) }
.chart .m { fill: var(--accent) } .chart .hit { fill: transparent } .chart .bar:hover .m { fill: color-mix(in srgb, var(--accent) 75%, var(--ink)) }
.chart .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: var(--card); font-size: 12px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none }
.blist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.blist li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px }
.bl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bl-bar { height: 8px; background: var(--hover); border-radius: 4px; overflow: hidden } .bl-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px }
.bl-n { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 28px; text-align: right }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } .sgrid { grid-template-columns: minmax(0, 1fr) } }
.cal-mode { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.cal-mode button { border: 0; background: var(--card); padding: 5px 12px; font-weight: 500; color: var(--muted) }
.cal-mode button[aria-pressed="true"] { background: var(--accent); color: #fff }
.week { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card) }
.wk-row { display: grid; grid-template-columns: 46px repeat(7, minmax(0, 1fr)) }
.wk-head > div { padding: 6px 8px; font: 500 12px var(--f-mono); color: var(--faint); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line) }
.wk-head > div:first-child { border-left: 0 }
.wk-head .today { color: var(--accent); font-weight: 700 }
.wk-allday > div { min-height: 30px; max-height: 70px; overflow-y: auto; padding: 3px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line) }
.wk-allday > .wk-lbl { border-left: 0; font: 500 10px var(--f-mono); color: var(--faint); justify-content: center; align-items: center }
.wk-allday > div.over, .wcol.over { background-color: var(--hover) }
.wk-body { min-height: 0 }
.wk-hours { display: grid; grid-template-rows: repeat(15, minmax(0, 1fr)); font: 500 10.5px var(--f-mono); color: var(--faint) }
.wk-hours > div { padding: 1px 6px 0 0; text-align: right; transform: translateY(-6px) }
.wk-hours > div:first-child { transform: none }
.wcol { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% calc(100% / 15); cursor: cell; min-height: 0 }
.wcol.today { background-color: rgba(47, 91, 255, .05) }
.wev { position: absolute; left: 2px; right: 2px; border-radius: 4px; padding: 2px 5px; font-size: 11.5px; line-height: 1.2; overflow: hidden; background: color-mix(in srgb, var(--pc) 32%, var(--card)); border-left: 3px solid var(--pc); color: var(--ink); cursor: grab; z-index: 1; text-decoration: none }
.wev b { font-family: var(--f-mono); font-weight: 500 }
.wev.done { opacity: .5; text-decoration: line-through }
.wev.appt { background: var(--ink); color: var(--card); border-left-color: var(--ink); cursor: pointer }
.wcol .now { position: absolute; left: 0; right: 0; height: 2px; background: var(--red); z-index: 2; pointer-events: none }
.appt { display: block; border-radius: 4px; padding: 3px 6px; font-size: 12px; line-height: 1.25; background: var(--ink); color: var(--card); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none }
.appt b { font-family: var(--f-mono); font-weight: 500; margin-right: 4px }
.appt.past { opacity: .5 }
.undated { display: flex; flex-direction: column; gap: 6px }
.undated h3 { margin: 0; font-size: 14px }
.undated p { margin: 0; color: var(--muted); font-size: 12.5px }

.empty-note { color: var(--faint); font-size: 13px; padding: 4px 4px 8px }

/* modal */

function meter(label, value, limit, note) {

function monthChart(txs) {
  const m = [...Array(12)].map(() => ({ i: 0, o: 0 }));
  txs.forEach(t => { const k = Number(t.date.slice(5, 7)) - 1; if (t.kind === "in") m[k].i += t.amount; else m[k].o += t.amount });
  const W = 1240, H = 150, padL = 60, padB = 24, padT = 10, max = Math.max(100, ...m.map(x => Math.max(x.i, x.o)));
  const mag = 10 ** Math.floor(Math.log10(max / 4)), step = Math.ceil(max / 4 / mag) * mag, top = step * 4, gw = (W - padL) / 12, bw = Math.min(28, gw / 2 - 6);
  const y = v => padT + (H - padT - padB) * (1 - v / top);
  const grid = [0, 1, 2, 3, 4].map(i => `<line x1="${padL}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}" class="gl"/><text x="${padL - 8}" y="${y(i * step) + 4}" class="ax" text-anchor="end">${(i * step).toLocaleString("de-DE")} €</text>`).join("");
  const bars = m.map((v, k) => { const cx = padL + k * gw + gw / 2;
    return `<g class="bar" data-tip="${MONTHS[k]}: Einnahmen ${eur(v.i)} · Ausgaben ${eur(v.o)} · Saldo ${eur(v.i - v.o)}"><rect class="hit" x="${padL + k * gw}" y="${padT}" width="${gw}" height="${H - padT - padB}"/>
      ${v.i ? `<rect x="${cx - bw - 1}" y="${y(v.i)}" width="${bw}" height="${y(0) - y(v.i)}" rx="3" style="fill:var(--c-in)"/>` : ""}

    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Einnahmen und Ausgaben pro Monat">${grid}${bars}</svg><div class="tip" hidden></div></div>`;
}

function saveBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000) }
function finCsv() {

  saveBlob(new Blob(["﻿" + csv], { type: "text/csv" }), `flow-media-ai-buchungen-${y}.csv`);

const loadXlsx = () => xlsxLib || (xlsxLib = new Promise((ok, fail) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxLib = null; fail() }; document.head.appendChild(s) }));
// same layout as the course's EÜR template: summary sheet + one sheet per month (expenses negative so the month sums give the result)
async function finXlsx() {
  let X; try { X = await loadXlsx() } catch { toast("Excel-Export konnte nicht geladen werden. Prüfe die Internetverbindung."); return }
  const y = finUi.year, txs = yearTxs(), me = invProfile().company || "Flow Media AI", wb = X.utils.book_new();
  const sign = t => t.kind === "in" ? 1 : -1, sums = [];
  const sheets = MONTHS.map((name, k) => {
    const rows = txs.filter(t => Number(t.date.slice(5, 7)) === k + 1).sort((a, b) => a.date.localeCompare(b.date)).map(t => [
      t.kind === "in" ? "Einnahme" : "Ausgabe", t.kind === "in" ? t.party || "" : me, t.kind === "in" ? me : t.party || "",
      new Date(t.date + "T12:00:00"), sign(t) * t.amount, sign(t) * netOf(t), "Geschäftlich", [t.title, t.note].filter(Boolean).join(" – "), t.receipt ? "ja" : "nein"]);
    const brutto = rows.reduce((n, r) => n + r[4], 0), netto = rows.reduce((n, r) => n + r[5], 0); sums.push([brutto, netto]);
    const ws = X.utils.aoa_to_sheet([[`Einnahmen, Ausgaben ${name} ${y}`], [], ["Einnahme, Ausgabe", "Quelle", "Empfänger", "Buchungsdatum", "Umsatz brutto", "Umsatz netto", "Privat, Geschäftlich", "Info", "Beleg vorhanden"], ...rows, [], ["Summe", "", "", "", brutto, netto]], { cellDates: true, dateNF: "dd\\.mm\\.yyyy" });
    ws["!cols"] = [14, 22, 22, 14, 14, 14, 18, 40, 15].map(wch => ({ wch }));
    return [`${y}_${String(k + 1).padStart(2, "0")}`, ws];
  });
  const sum = X.utils.aoa_to_sheet([[`Zusammenfassung ${y}`], [], ["Monat", "Total brutto", "Total netto"], ...MONTHS.map((m, k) => [m, sums[k][0], sums[k][1]]), [], [`Total ${y}`, sums.reduce((n, s) => n + s[0], 0), sums.reduce((n, s) => n + s[1], 0)]]);
  sum["!cols"] = [{ wch: 16 }, { wch: 14 }, { wch: 14 }];
  X.utils.book_append_sheet(wb, sum, "Zusammenfassung");
  sheets.forEach(([n, ws]) => X.utils.book_append_sheet(wb, ws, n));
  X.writeFile(wb, `Einnahmen_Ausgaben_${y}.xlsx`);
}

const fmtN = n => Number(n || 0).toLocaleString("de-DE");
function delta(cur, prev) {
  if (!prev) return cur ? `<span class="kd">neu</span>` : `<span class="kd">–</span>`;
  const d = Math.round((cur - prev) / prev * 100);
  return `<span class="kd ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "+" : ""}${d} % ggü. Vorzeitraum</span>`;
}
function barList(rows, nameMap = {}) {
  if (!rows?.length) return `<p class="sub">Noch keine Daten.</p>`;
  const max = Math.max(...rows.map(r => Number(r[1]) || 0), 1);
  return `<ul class="blist">${rows.map(([name, n]) => { const label = nameMap[name] || (name === "$direct" ? "Direkt / unbekannt" : name || "–");
    return `<li title="${esc(label)}: ${fmtN(n)}"><span class="bl-name">${esc(label)}</span><span class="bl-bar"><i style="width:${(n / max * 100).toFixed(1)}%"></i></span><span class="bl-n">${fmtN(n)}</span></li>` }).join("")}</ul>`;
}
function dailyChart(rows, days) {
  const map = Object.fromEntries((rows || []).map(r => [r[0], r]));
  const pts = [...Array(days)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (days - 1 - i)); const k = ymd(d); const r = map[k]; return { k, d, pv: r ? Number(r[1]) : 0, visits: r ? Number(r[2]) : 0, cta: r ? Number(r[3]) : 0 } });
  const W = 1240, H = 230, padL = 36, padB = 24, padT = 10, max = Math.max(4, ...pts.map(p => p.visits));
  const step = Math.ceil(max / 4), top = step * 4, bw = (W - padL) / pts.length;
  const y = v => padT + (H - padT - padB) * (1 - v / top);
  const grid = [0, 1, 2, 3, 4].map(i => `<line x1="${padL}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}" class="gl"/><text x="${padL - 6}" y="${y(i * step) + 4}" class="ax" text-anchor="end">${i * step}</text>`).join("");
  const bars = pts.map((p, i) => { const x = padL + i * bw + 1, h = y(0) - y(p.visits);
    const lab = `${p.d.getDate()}.${p.d.getMonth() + 1}.`;
    return `<g class="bar" data-tip="${esc(`${DOW[(p.d.getDay() + 6) % 7]} ${lab} · ${fmtN(p.visits)} Besuche · ${fmtN(p.pv)} Aufrufe · ${fmtN(p.cta)} Klicks`)}"><rect class="hit" x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}"/>${p.visits ? `<rect class="m" x="${x}" y="${y(p.visits)}" width="${Math.max(bw - 2, 1)}" height="${h}" rx="${Math.min(3, bw / 3)}"/>` : ""}</g>` }).join("");
  const every = days <= 7 ? 1 : days <= 30 ? 5 : 15;
  const labels = pts.map((p, i) => i % every === 0 || i === pts.length - 1 ? `<text x="${padL + i * bw + bw / 2}" y="${H - 6}" class="ax" text-anchor="middle">${p.d.getDate()}.${p.d.getMonth() + 1}.</text>` : "").join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Besuche pro Tag, letzte ${days} Tage">${grid}${bars}${labels}</svg><div class="tip" hidden></div></div>`;
}
function renderStats() {
  const head = `<div class="cal-head"><h2 style="margin:0">Landingpage</h2>
    <a class="mini" href="${LANDING_URL}" target="_blank" rel="noopener">Seite öffnen</a>
    ${stats.data?.link ? `<a class="mini" href="${esc(stats.data.link)}" target="_blank" rel="noopener">In PostHog</a>` : ""}
    <span class="cal-mode" role="group" aria-label="Zeitraum">${[7, 30, 90].map(d => `<button type="button" data-days="${d}" aria-pressed="${stats.days === d}">${d} Tage</button>`).join("")}</span></div>`;
  let body;
  if (!WEB) body = `<div class="note">Die Auswertung gibt es in der Web-Version deines Boards.</div>`;
  else if (stats.loading && !stats.data) body = `<p class="sub">Lade Zahlen aus PostHog …</p>`;
  else if (stats.error) body = `<div class="note">${esc(stats.error)}<button type="button" class="mini" data-stats-reload>Erneut laden</button></div>`;
  else if (stats.data?.status === "no_token") body = `<div class="note">Noch nicht verbunden: Lege in Supabase das Secret <b>POSTHOG_API_KEY</b> an (persönlicher PostHog-Schlüssel mit Leserecht für Abfragen). Dann erscheinen hier deine Zahlen.</div>`;
  else if (stats.data?.status === "ok") {
    const k = stats.data.kpi, p = stats.data.prev, rate = k.visits ? (k.cal / k.visits * 100) : 0, prate = p.visits ? (p.cal / p.visits * 100) : 0;
    body = `<div class="kpis">
        <div class="kpi"><span class="kl">Besuche</span><b>${fmtN(k.visits)}</b>${delta(k.visits, p.visits)}</div>
        <div class="kpi"><span class="kl">Seitenaufrufe</span><b>${fmtN(k.pv)}</b>${delta(k.pv, p.pv)}</div>
        <div class="kpi"><span class="kl">Klicks auf „Termin“</span><b>${fmtN(k.cal)}</b>${delta(k.cal, p.cal)}</div>
        <div class="kpi"><span class="kl">Termin-Quote</span><b>${rate.toLocaleString("de-DE", { maximumFractionDigits: 1 })} %</b><span class="kd">Klicks auf Termin je Besuch${p.visits ? ` · vorher ${prate.toLocaleString("de-DE", { maximumFractionDigits: 1 })} %` : ""}</span></div>
      </div>
      <div class="sgrid">
        <div class="panel spanel wide"><h3>Besuche pro Tag</h3>${dailyChart(stats.data.daily, stats.data.days)}</div>
        <div class="panel spanel"><h3>Woher kommen die Besuche?</h3>${barList(stats.data.refs)}</div>
        <div class="panel spanel"><h3>Welche Buttons werden geklickt?</h3>${barList(stats.data.ctas, CTA_NAMES)}</div>
        <div class="panel spanel"><h3>Geräte</h3>${barList(stats.data.devices, DEVICE_NAMES)}</div>
      </div>
      <p class="sub" style="margin:0">Gezählt wird ohne Cookies: ein „Besuch“ ist ein Seitenbesuch, wiederkehrende Personen werden nicht wiedererkannt.</p>`;
  } else body = `<p class="sub">Lade …</p>`;
  return `<section class="panel stats">${head}${body}</section>`;
}
document.addEventListener("mouseover", e => {
  const g = e.target.closest?.(".chart .bar"), c = e.target.closest?.(".chart"); if (!c) return;
  const tip = c.querySelector(".tip");
  if (!g) { tip.hidden = true; return }
  tip.textContent = g.dataset.tip; tip.hidden = false;
  const r = c.getBoundingClientRect(), b = g.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(b.left - r.left + b.width / 2, 80), r.width - 80) + "px";
});
document.addEventListener("mouseleave", e => { if (e.target.classList?.contains("chart")) e.target.querySelector(".tip").hidden = true }, true);

function closeModal() { $("#layer").innerHTML = "" }

document.addEventListener("click", e => {
  const tgt = e.target;
  const go = tgt.closest("[data-dbx-go]"); if (go) { dbxGo(go.dataset.dbxGo); return }
  const gg = tgt.closest("[data-gh-go]"); if (gg) { ghGo(gg.dataset.ghGo); return }
  const gl = tgt.closest("[data-gh-link]");
  if (gl) {
    gl.disabled = true;
    filesCol.doc(newId()).set({ kind: "github", url: gl.dataset.ghLink, name: gl.dataset.ghName, path: gl.dataset.ghPath, repo: gh.repo, taskId: gh.pickFor, createdAt: Date.now() })
      .then(() => { toast("Mit der Karte verknüpft"); if (WEB) scheduleReload(0) }, writeErr);
    return;
  }
  const lk = tgt.closest("[data-dbx-link]");
  if (lk) { lk.disabled = true; linkDropbox(lk.dataset.dbxLink, lk.dataset.dbxName, lk.dataset.dbxSize, dbx.pickFor); return }
  const fd = tgt.closest("[data-file-del]");
  if (fd) {
    if (fd.dataset.armed) deleteFile(fd.dataset.fileDel);
    else { const orig = fd.textContent; fd.dataset.armed = "1"; fd.textContent = "Sicher?"; setTimeout(() => { if (fd.isConnected) { delete fd.dataset.armed; fd.textContent = orig } }, 3000) }
    return;
  }
  if (tgt.closest("[data-close-menu]")) { closeModal(); return }
  const bg = tgt.closest("[data-bg]"); if (bg) { if (!readOnly) saveMeta({ bg: bg.dataset.bg }); closeModal(); return }
  if (tgt.closest("[data-close-btn]") || tgt.matches("[data-close-modal]")) { closeModal(); return }
  if (tgt.closest("#layer")) return;
  const v = tgt.closest("[data-view]"); if (v) { view = v.dataset.view; composerFor = null; try { localStorage.setItem("flow-board-view", view) } catch {} render(); if (view === "files") refreshUsage(); if (view === "stats" && !stats.data && !stats.loading) loadStats(); return }
  if (tgt.closest("#btn-menu")) { openMenu(tgt.closest("#btn-menu")); return }
  if (tgt.closest("#btn-star")) { if (!readOnly) saveMeta({ starred: !meta.starred }); return }
  if (tgt.closest("#board-title") && !readOnly) {
    $("#title-slot").innerHTML = `<input class="title-input" id="title-input" value="${esc(meta.name)}" maxlength="60" aria-label="Board-Name">`;
    const inp = $("#title-input"); inp.focus(); inp.select();
    const done = () => { const v = inp.value.trim() || meta.name; $("#title-slot").innerHTML = `<button class="title" id="board-title" title="Board umbenennen"></button>`; saveMeta({ name: v }) };
    inp.addEventListener("blur", done, { once: true });
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") inp.blur(); if (ev.key === "Escape") { inp.value = meta.name; inp.blur() } });
    return;
  }
  const co = tgt.closest("[data-compose-open]"); if (co) { composerFor = co.dataset.composeOpen; render(); return }
  if (tgt.closest("[data-cancel-compose]")) { composerFor = null; render(); return }
  const so = tgt.closest("[data-sort]");
  if (so && !readOnly) {
    sortByPrio(tasks.filter(t => t.status === so.dataset.sort)).forEach((t, i) => { if ((t.order ?? 0) !== i) patchTask(t.id, { order: i }) });
    toast("Nach Priorität sortiert"); return;
  }
  const nd = tgt.closest("[data-new-due]"); if (nd) { openCard(blank({ due: nd.dataset.newDue, status: "todo", order: nextOrder("todo") }), true); return }
  const calItem = view === "cal" && tgt.closest(".week [data-id], .cal [data-id]");
  if (calItem) {
    // the first click re-renders the grid, so the browser never sees a double click: detect it here
    const id = calItem.dataset.id, now = Date.now(), dbl = lastCalClick.id === id && now - lastCalClick.t < 450;
    lastCalClick = { id, t: dbl ? 0 : now };
    if (dbl) { const t = tasks.find(x => x.id === id); if (t) openCard(t); return }
    calSel = id; calSlot = null; render(); return;
  }
  const card = tgt.closest("[data-id]"); if (card) { const t = tasks.find(x => x.id === card.dataset.id); if (t) openCard(t) ; return }
  const sd = tgt.closest("[data-days]"); if (sd) { stats.days = Number(sd.dataset.days); stats.data = null; loadStats(); return }
  if (tgt.closest("[data-stats-reload]")) { loadStats(); return }
  const cm = tgt.closest("[data-calmode]");
  if (cm) { calMode = cm.dataset.calmode; try { localStorage.setItem("flow-board-calmode", calMode) } catch {} ; if (calMode === "week") weekStart = mondayOf(calCursor.getMonth() === new Date().getMonth() ? new Date() : calCursor); else calCursor = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1); render(); return }
  const step = d => { if (calMode === "week") { weekStart = new Date(weekStart); weekStart.setDate(weekStart.getDate() + 7 * d) } else calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + d, 1); render() };
  if (tgt.id === "cal-prev") step(-1);
  if (tgt.id === "cal-next") step(1);
  if (tgt.id === "cal-today") { calCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1); weekStart = mondayOf(new Date()); render() }
  const wc = tgt.closest(".wcol");
  if (wc && tgt === wc && !readOnly) {
    const r = wc.getBoundingClientRect(), m = Math.max(H0 * 60, Math.min(H1 * 60 - 30, Math.floor((H0 * 60 + (e.clientY - r.top) / r.height * H_SPAN) / 30) * 30));
    // the first click re-renders the grid, so a double click on an empty slot is detected here
    const key = "slot:" + wc.dataset.day + ":" + m, now = Date.now(), dbl = lastCalClick.id === key && now - lastCalClick.t < 450;
    lastCalClick = { id: key, t: dbl ? 0 : now };
    calSlot = { day: wc.dataset.day, m }; calSel = null;
    if (dbl) { calAction("new"); return }
    render(); return;
  }
  const dc = view === "cal" && !readOnly && tgt.closest(".cal .day");
  if (dc && !tgt.closest("button, a")) {
    const key = "day:" + dc.dataset.day, now = Date.now(), dbl = lastCalClick.id === key && now - lastCalClick.t < 450;
    lastCalClick = { id: key, t: dbl ? 0 : now };
    calSlot = { day: dc.dataset.day, m: null }; calSel = null;
    if (dbl) { calAction("new"); return }
    render();
  }
});

const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes("Files");
document.addEventListener("dragover", e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  const zone = e.target.closest?.("[data-filezone]") || e.target.closest?.(".card[data-id]");
  document.querySelectorAll(".filedrop, .dropzone.over").forEach(x => x.classList.remove("filedrop", "over"));
  if (zone && !readOnly && assetsApi) zone.classList.add(zone.matches(".card") ? "filedrop" : "over");
  e.dataTransfer.dropEffect = zone && assetsApi ? "copy" : "none";
});
document.addEventListener("drop", e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  document.querySelectorAll(".filedrop, .dropzone.over").forEach(x => x.classList.remove("filedrop", "over"));
  const card = e.target.closest?.(".card[data-id]"), zone = e.target.closest?.("[data-filezone]");
  if (!card && !zone) return;
  const list = [...e.dataTransfer.files]; if (!list.length) return;
  uploadFiles(list, card ? card.dataset.id : "");
}, true);

// Card drag & drop with pointer events: works with mouse, pen and touch (long press), in every browser.
const drag = { el: null, id: null, ghost: null, sx: 0, sy: 0, ox: 0, oy: 0, active: false, pending: false, timer: null, lastZone: null, x: 0, y: 0, raf: 0, snapM: null, isWev: false };
let suppressClick = false, renderQueued = false;
const clearOver = () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over"));
function zoneAt(x, y) { const el = document.elementFromPoint(x, y); return el?.closest?.("[data-drop]") || null }
function startDrag() {
  const r = drag.el.getBoundingClientRect();
  drag.ox = drag.sx - r.left; drag.oy = drag.sy - r.top;
  const g = drag.el.cloneNode(true);
  g.classList.add("drag-ghost"); g.style.width = r.width + "px"; g.style.height = r.height + "px"; g.style.left = r.left + "px"; g.style.top = r.top + "px";
  drag.isWev = drag.el.classList.contains("wev"); if (drag.isWev) g.classList.add("wev-ghost");
  document.body.appendChild(g); drag.ghost = g;
  drag.el.classList.add("dragging"); drag.active = true; document.body.classList.add("is-dragging");
}
function autoScroll() {
  if (!drag.active) return;
  const main = $("#main"), m = main.getBoundingClientRect(), edge = 60;
  if (drag.x < m.left + edge) main.scrollLeft -= 14; else if (drag.x > m.right - edge) main.scrollLeft += 14;
  const z = zoneAt(drag.x, drag.y);
  if (z) { const zr = z.getBoundingClientRect(); if (drag.y < zr.top + 30) z.scrollTop -= 10; else if (drag.y > zr.bottom - 30) z.scrollTop += 10 }
  drag.raf = requestAnimationFrame(autoScroll);
}
document.addEventListener("pointerdown", e => {
  if (readOnly || e.button > 0) return;
  if (e.target.closest?.(".card-del")) return;
  const el = e.target.closest?.("#main [data-id]"); if (!el) return;
  Object.assign(drag, { el, id: el.dataset.id, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, pending: true, active: false });
  if (e.pointerType === "touch") drag.timer = setTimeout(() => { if (drag.pending) { startDrag(); autoScroll(); navigator.vibrate?.(15) } }, 280);
});
document.addEventListener("pointermove", e => {
  if (!drag.pending) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.active) {
    const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if (e.pointerType === "touch") { if (moved > 10) { clearTimeout(drag.timer); drag.pending = false } return }
    if (moved < 5) return;
    startDrag(); autoScroll();
  }
  const z = zoneAt(e.clientX, e.clientY);
  drag.ghost.classList.toggle("copying", !!(e.ctrlKey || e.altKey || e.metaKey));
  if (drag.isWev && z?.dataset.drop.startsWith("wday:")) {
    // snap the preview into the day column on a 15-minute grid, keeping where the appointment was grabbed
    const r = z.getBoundingClientRect(), t = tasks.find(x => x.id === drag.id);
    const dur = t?.time && t?.endTime ? toMin(t.endTime) - toMin(t.time) : 60;
    const m = Math.max(H0 * 60, Math.min(H1 * 60 - 15, snap15(H0 * 60 + (e.clientY - drag.oy - r.top) / r.height * H_SPAN)));
    drag.snapM = m;
    Object.assign(drag.ghost.style, { left: r.left + 2 + "px", width: r.width - 4 + "px", top: r.top + pctOf(m) / 100 * r.height + "px" });
    drag.ghost.querySelector("b").textContent = fromMin(m) + "–" + fromMin(Math.min(m + dur, 24 * 60 - 1));
  } else {
    drag.snapM = null;
    drag.ghost.style.left = (e.clientX - drag.ox) + "px"; drag.ghost.style.top = (e.clientY - drag.oy) + "px";
  }
  if (z !== drag.lastZone) { clearOver(); z?.classList.add("over"); drag.lastZone = z }
});
document.addEventListener("touchmove", e => { if (drag.active) e.preventDefault() }, { passive: false });
function endDrag(e, cancel) {
  clearTimeout(drag.timer); cancelAnimationFrame(drag.raf);
  const wasActive = drag.active, id = drag.id, snapM = drag.snapM, copy = !!(e.ctrlKey || e.altKey || e.metaKey);
  drag.ghost?.remove(); drag.el?.classList.remove("dragging"); document.body.classList.remove("is-dragging");
  clearOver();
  Object.assign(drag, { el: null, ghost: null, active: false, pending: false, lastZone: null, snapM: null, isWev: false });
  if (!wasActive) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 0);
  if (!cancel) dropOn(zoneAt(e.clientX, e.clientY), id, e.clientY, { snapM, copy });
  if (renderQueued) { renderQueued = false; render() }
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));
document.addEventListener("keydown", e => { if (e.key === "Escape" && drag.active) endDrag(e, true) });
document.addEventListener("click", e => {
  const del = e.target.closest?.(".card-del"); if (!del || readOnly) return;
  e.stopPropagation(); e.preventDefault();
  const t = tasks.find(x => x.id === del.dataset.del); if (!t) return;
  removeTask(t.id);
  toast(`„${t.title.length > 40 ? t.title.slice(0, 40) + "…" : t.title}“ gelöscht`, { label: "Rückgängig", fn: () => { saveTask({ ...t, updatedAt: Date.now() }); toast("Wiederhergestellt") } });
}, true);
document.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault() } }, true);
document.addEventListener("keydown", e => {
  const el = e.target.closest?.("#main [data-id]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const t = el.closest(".week, .cal") && tasks.find(x => x.id === el.dataset.id); t ? openCard(t) : el.click() }
});
function dropOn(z, id, clientY, opts = {}) {
  if (!z) return;
  const [kind, val] = z.dataset.drop.split(":");
  if (kind === "status") {
    // place relative to the card under the pointer
    const cards = [...z.querySelectorAll("[data-id]")].filter(c => c.dataset.id !== id);
    const before = cards.find(c => clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
    const list = sortTasks(tasks.filter(t => t.status === val && t.id !== id));
    const idx = before ? list.findIndex(t => t.id === before.dataset.id) : list.length;
    list.splice(idx, 0, tasks.find(t => t.id === id));
    list.forEach((t, i) => {
      if (t.id === id) patchTask(id, { status: val, order: i });
      else if ((t.order ?? 0) !== i) patchTask(t.id, { order: i });
    });
  }
  if (kind === "quad") { const q = QUADS.find(x => x.p === Number(val)); patchTask(id, { important: q.imp, urgent: q.urg }) }
  if (kind === "due") { if (opts.copy && val) { const t = tasks.find(x => x.id === id); if (t) { const c = cloneTask(t, { due: val }); calSel = c.id; render(); toast("Kopie angelegt") } } else patchTask(id, { due: val || "" }) }
  // calendar drops move the appointment; with Ctrl/Alt/Cmd held they place a copy (like Outlook)
  const place = patch => { const t = tasks.find(x => x.id === id); if (!t) return;
    if (opts.copy) { const c = cloneTask(t, patch); calSel = c.id; render(); toast("Kopie angelegt") } else { calSel = id; patchTask(id, patch) } };
  if (kind === "allday") place({ due: val, time: "", endTime: "" });
  if (kind === "wday") {
    const t = tasks.find(x => x.id === id), r = z.getBoundingClientRect();
    const m = opts.snapM ?? Math.max(H0 * 60, Math.min(H1 * 60 - 15, snap15(H0 * 60 + (clientY - r.top) / r.height * H_SPAN)));
    const dur = t?.time && t?.endTime ? toMin(t.endTime) - toMin(t.time) : 60;
    place({ due: val, time: fromMin(m), endTime: fromMin(Math.min(m + dur, 24 * 60 - 1)) });
  }
}

if (DEMO) $("#demo-pill").hidden = false;

try { const v = localStorage.getItem("flow-board-view"); if (["board", "matrix", "cal", "files", "stats", "fin"].includes(v)) view = v } catch {}

/* ---------- WEB: Supabase backend, no login: a secret board link (#b=<board>&k=<key>) unlocks the board ---------- */
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s) }) }
const BOARD_FN = SB_URL + "/functions/v1/flow-board";
const CREDS_KEY = "flow-board-creds";
let sb = null, creds = null, rtChannel = null;
function readCreds() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("b") && h.get("k")) {
    creds = { board: h.get("b"), key: h.get("k") };
    try { localStorage.setItem(CREDS_KEY, JSON.stringify(creds)) } catch {}
    history.replaceState(null, "", location.pathname + location.search);
    return creds;
  }
  try { creds = JSON.parse(localStorage.getItem(CREDS_KEY) || "null") } catch { creds = null }
  return creds;
}
const shareLink = () => location.origin + location.pathname + "#b=" + encodeURIComponent(creds.board) + "&k=" + encodeURIComponent(creds.key);
async function api(action, extra = {}) {
  const r = await fetch(BOARD_FN, { method: "POST", headers: { "content-type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
    body: JSON.stringify({ board: creds.board, key: creds.key, action, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: j.error === "denied" ? "denied" : "web", message: j.message || j.error || r.status };
  return j;
}
function keyScreen(msg = "") {
  let el = $("#auth"); if (!el) { el = document.createElement("div"); el.id = "auth"; document.body.appendChild(el) }
  el.innerHTML = `<div class="scrim" style="align-items:center"><form class="modal" id="key-form" style="grid-template-columns:minmax(0,1fr);width:min(420px,100%)">
    <h2 style="margin:0;font-size:20px">Flow Board</h2>
    <p style="margin:0;color:var(--muted)">Öffne dein Board über deinen persönlichen Link – oder füg ihn hier ein.</p>
    <div class="sec" style="margin:0"><label for="key-in" style="font-size:12px;font-weight:600;color:var(--muted)">Board-Link</label><input id="key-in" required placeholder="https://…/board/#b=…&k=…"></div>
    ${msg ? `<div class="note">${esc(msg)}</div>` : ""}
    <div class="mfoot"><button class="btn" type="submit">Board öffnen</button></div></form></div>`;
  $("#key-form").onsubmit = e => {
    e.preventDefault();
    const v = $("#key-in").value.trim(), h = new URLSearchParams(v.includes("#") ? v.split("#")[1] : v);
    if (!h.get("b") || !h.get("k")) return keyScreen("Das sieht nicht wie dein Board-Link aus. Er enthält „#b=“ und „&k=“.");
    creds = { board: h.get("b"), key: h.get("k") };
    try { localStorage.setItem(CREDS_KEY, JSON.stringify(creds)) } catch {}
    startBoard();
  };
}
async function refreshSigned() {
  const paths = files.filter(f => f.kind === "asset" && !signed[f.assetId]).map(f => f.assetId);
  if (!paths.length) return;
  try { const j = await api("sign", { paths }); j.urls.forEach(x => { if (x.url) signed[x.path] = x.url }) } catch { return }
  if (!$("#layer").innerHTML) render(); else { const m = $("#modal"); if (m?.dataset.task) renderCardFiles(m.dataset.task) }
}
const rowToTask = r => ({ id: r.id, ...r.data });
async function loadCalendly() {
  try { const j = await api("calendly"); calEvents = j.events || []; calStatus = j.status || "ok" }
  catch (e) { calStatus = "error" }
  if (view === "cal" && !$("#layer").innerHTML) render();
}
async function reloadBoard() {
  const j = await api("load");
  tasks = j.tasks.map(rowToTask); files = j.files.map(rowToTask); fin = (j.finance || []).map(rowToTask);
  if (j.meta) meta = { ...meta, ...j.meta };
  loaded = true; applyBackground();
  if (!$("#layer").innerHTML) render(); else { renderBar(); const m = $("#modal"); if (m?.dataset.task) renderCardFiles(m.dataset.task) }
  refreshSigned();
}
let reloadTimer = 0;
function scheduleReload(ms = 300) { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => reloadBoard().catch(() => {}), ms) }
const ping = r => { rtChannel?.send({ type: "broadcast", event: "changed", payload: {} }); return r };
async function sha256hex(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("") }
async function startBoard() {
  try { await reloadBoard() }
  catch (e) {
    if (e.code === "denied") { try { localStorage.removeItem(CREDS_KEY) } catch {} ; return keyScreen("Dieser Link passt zu keinem Board.") }
    toast("Das Board konnte nicht geladen werden. Prüfe die Internetverbindung."); return;
  }
  $("#auth")?.remove();
  const table = name => ({ doc: id => ({
    set: data => api("upsert", { table: name, id, data }).then(ping),
    delete: () => api("delete", { table: name, id }).then(ping),
  }) });
  tasksCol = table("tasks"); filesCol = table("files"); finCol = table("finance");
  metaDoc = { set: data => api("meta", { data }).then(ping) };
  assetsApi = {
    upload: async (f, { type }) => {
      const { path, token } = await api("upload", { name: f.name });
      const r = await sb.storage.from("flow-board").uploadToSignedUrl(path, token, f, { contentType: type });
      if (r.error) throw { code: /size|large/i.test(r.error.message) ? "too_large" : "upstream_error", message: r.error.message };
      ping(); return { id: path, url: "", sizeBytes: f.size, contentType: type };
    },
    delete: async path => { await api("remove", { path }) },
    list: async () => { const a = files.filter(f => f.kind === "asset"); return { usage: { files: a.length, bytes: a.reduce((n, f) => n + (f.size || 0), 0), maxBytes: 1024 * 1048576, maxFiles: 10000 } } },
  };
  render();
  // live updates: other devices announce changes on a channel only key holders can name; polling as fallback
  rtChannel = sb.channel("fb-" + (await sha256hex(creds.key + "#rt")).slice(0, 32));
  rtChannel.on("broadcast", { event: "changed" }, () => scheduleReload()).subscribe();
  setInterval(() => { if (!document.hidden && !drag.active) scheduleReload(0) }, 30000);
  loadCalendly(); setInterval(() => { if (!document.hidden) loadCalendly() }, 5 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleReload(0) });
}
async function bootWeb() {
  try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js") }
  catch { toast("Eine Bibliothek konnte nicht geladen werden. Prüfe die Internetverbindung."); return }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
  if (readCreds()) startBoard(); else keyScreen();
  window.addEventListener("hashchange", () => { if (location.hash.includes("k=") && readCreds()) startBoard() });
}
document.addEventListener("click", async e => {
  if (e.target.id === "web-copy") {
    try { await navigator.clipboard.writeText(shareLink()); toast("Link kopiert – auf dem anderen Gerät öffnen") }
    catch { const i = $("#web-link"); if (i) { i.hidden = false; i.select() } }
  }
  if (e.target.id === "web-forget") { try { localStorage.removeItem(CREDS_KEY) } catch {} ; location.reload() }
  if (e.target.closest?.("[data-link-add]")) {
    const url = $("#lnk-url").value.trim(), name = $("#lnk-name").value.trim();
    if (!/^https:\/\//i.test(url)) { toast("Bitte einen Link mit https:// einfügen."); return }
    try { await filesCol.doc(newId()).set({ kind: "link", url, name: name || url.replace(/^https:\/\/(www\.)?/, "").slice(0, 60), taskId: dbx.pickFor, createdAt: Date.now() }); toast("Link angehängt"); $("#lnk-url").value = ""; $("#lnk-name").value = ""; scheduleReload(0) }
    catch (err) { writeErr(err) }
  }
});

/* ---------- boot: shared store if available, else this browser ---------- */
(async () => {
  if (WEB) return bootWeb();
  const db = !DEMO && window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (DEMO || !db) { lsLoad(); if (DEMO && !tasks.length) seedDemo(); loaded = true; applyBackground(); render(); return }
  tasksCol = db.collection("tasks");
  metaDoc = db.doc("board/meta");
  metaDoc.onSnapshot(s => { if (s.exists) { meta = { ...meta, ...s.data() }; applyBackground(); renderBar() } }, () => {});
  finCol = db.collection("finance");
  finCol.onSnapshot(s => { fin = s.docs.map(d => ({ id: d.id, ...d.data() })); if (view === "fin" && !$("#layer").innerHTML) render() }, () => {});
  filesCol = db.collection("files");
  filesCol.onSnapshot(s => {
    files = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const m = $("#modal"); if (m?.dataset.task) { renderCardFiles(m.dataset.task); refreshDbx() }
    if (!$("#layer").innerHTML) render();
  }, () => {});
  claude.use("assets").then(a => { assetsApi = a; if (view === "files") refreshUsage(); if (!$("#layer").innerHTML) render() }).catch(() => {});
  claude.use("mcp").then(m => { mcpApi = m; refreshDbx() }).catch(() => {});
  tasksCol.onSnapshot(s => {
    tasks = s.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded = true;
    if (!$("#layer").innerHTML) render(); else renderBar();
  }, err => { if (err.code === "revoked") readOnly = true; toast("Verbindung zum Speicher unterbrochen. Lade die Seite neu."); });
})();
