<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow DNA · Strang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kern.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#070708;color:rgba(255,255,255,.8);font:400 16px/1.55 Inter,sans-serif;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;max-width:1100px;margin:0 auto}.top img{height:26px}
.top button{border:1px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:999px;padding:9px 16px;font:600 14px Inter;cursor:pointer}
.hero{text-align:center;padding:40px 20px 10px;position:relative}
.k{font:600 13px Montserrat;letter-spacing:.24em;text-transform:uppercase;color:#bbb}
h1{font:700 clamp(64px,14vw,160px)/.85 Oswald;text-transform:uppercase;color:#fff;margin:14px 0}
h1 span{color:#2F5BFF;text-shadow:0 0 40px rgba(47,91,255,.6)}
.hero p{max-width:620px;margin:0 auto;font-size:18px}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:24px 0 6px;font:600 13px Montserrat;letter-spacing:.12em;text-transform:uppercase}
.legend button{background:none;border:1px solid rgba(255,255,255,.18);color:#ddd;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.legend button.on{border-color:#2F5BFF;color:#fff;box-shadow:0 0 20px rgba(47,91,255,.4)}
.strand{position:relative;max-width:900px;margin:30px auto 40px;padding:0 16px}
#helix{position:absolute;left:50%;top:0;transform:translateX(-50%);width:140px;height:100%;pointer-events:none}
.pair{position:relative;display:grid;grid-template-columns:1fr 140px 1fr;align-items:center;min-height:150px}
.node{grid-column:1;justify-self:end;text-align:right;max-width:330px;cursor:pointer;padding:16px 18px;border-radius:18px;background:rgba(18,18,22,.9);border:1px solid rgba(255,255,255,.1);transition:transform .25s,border-color .25s;opacity:0;transform:translateY(20px)}
.pair:nth-child(even) .node{grid-column:3;justify-self:start;text-align:left}
.node.in{opacity:1;transform:none}.node:hover{border-color:#2F5BFF}
.node .ic{font-size:30px}.node h3{font:700 28px/1 Oswald;text-transform:uppercase;color:#fff;margin:6px 0}.node p{margin:0;font-size:14px}
.node .dna-badges{margin-top:8px}.pair:nth-child(odd) .node .dna-badges{justify-content:flex-end}
.dot{grid-column:2;grid-row:1;justify-self:center;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;z-index:2}
.dot.premium{background:#2F5BFF;box-shadow:0 0 26px #2F5BFF}.dot.geplant{background:transparent;border:2px dashed #888;box-shadow:none}
@media(max-width:700px){.pair{grid-template-columns:60px 1fr;min-height:0;margin-bottom:14px}.node,.pair:nth-child(even) .node{grid-column:2;justify-self:stretch;text-align:left;max-width:none}.pair:nth-child(odd) .node .dna-badges{justify-content:flex-start}.dot{grid-column:1}#helix{left:30px;width:60px}}
.end{text-align:center;padding:30px 20px 70px}.end h2{font:700 44px Oswald;text-transform:uppercase;color:#fff;margin:0 0 10px}
.pk{max-width:640px;margin:0 auto 30px;border:1px solid rgba(47,91,255,.5);border-radius:22px;padding:22px;background:linear-gradient(160deg,#121a3d,#0B0B0B)}
</style></head><body>
<div class="top"><img src="img/logo_flow.png" alt="Flow Media AI"><button data-submit>+ Skill einreichen</button></div>
<section class="hero"><div class="k">Skill Store · Flow Media AI</div><h1>Flow<br><span>DNA.</span></h1>
<p>Die DNA eines Business, das mit KI arbeitet: jeder Skill ein Baustein. Weiß = kostenlos, Blau = Premium, gestrichelt = kommt bald.</p>
<div class="legend" id="lg"><button data-st="alle" class="on">Ganzer Strang</button><button data-st="basis">Kostenlos</button><button data-st="premium">Premium</button></div></section>
<section class="strand" id="strand"><svg id="helix" preserveAspectRatio="none"></svg><div id="pairs"></div></section>
<section class="end"><div id="pk"></div><h2>Füg deinen Baustein hinzu</h2><p>Community-Skills werden geprüft und dann für alle freigeschaltet.</p><p style="margin-top:16px"><button class="dna-btn" data-submit>Skill einreichen</button></p></section>
<script src="daten.js"></script><script src="kern.js"></script>
<script>
const st={stufe:"alle"};
function draw(){const L=DNA.filter(st);
 document.getElementById("pairs").innerHTML=L.map(s=>`<div class="pair"><div class="dot ${s.status==="geplant"?"geplant":s.stufe}"></div><div class="node" data-skill="${s.id}"><div class="ic">${s.icon}</div><h3>${DNA.esc(s.name)}</h3><p>${DNA.esc(s.kurz)}</p><div class="dna-badges">${DNA.badges(s)}</div></div></div>`).join("");
 helix();io()}
function helix(){const sv=document.getElementById("helix"),h=document.getElementById("pairs").offsetHeight,w=sv.clientWidth||140,t=performance.now()/1600;sv.setAttribute("viewBox",`0 0 ${w} ${h}`);
 let a="",b="",r="";for(let y=0;y<=h;y+=8){const p=y/90+t,x1=w/2+Math.sin(p)*w*.4,x2=w/2-Math.sin(p)*w*.4;a+=(y?"L":"M")+x1.toFixed(1)+","+y;b+=(y?"L":"M")+x2.toFixed(1)+","+y;if(y%40===0)r+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="rgba(255,255,255,.12)" stroke-width="2"/>`}
 sv.innerHTML=r+`<path d="${a}" fill="none" stroke="#2F5BFF" stroke-width="3" opacity=".9"/><path d="${b}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>`}
function loop(){helix();requestAnimationFrame(loop)}requestAnimationFrame(loop);
let obs;function io(){obs&&obs.disconnect();obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in")}),{threshold:.15});document.querySelectorAll(".node").forEach(n=>obs.observe(n))}
document.getElementById("pk").innerHTML=DNA.pakete.map(p=>`<div class="pk"><div class="k">Premium-Paket</div><h3 style="font:700 32px Oswald;text-transform:uppercase;color:#fff;margin:6px 0">${p.name}</h3><p style="margin:0">${p.kurz}</p><p style="margin:10px 0 0;color:#fff">${p.skills.map(id=>DNA.skills.find(s=>s.id===id).name).join(" · ")}</p></div>`).join("");
document.getElementById("lg").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.stufe=b.dataset.st;[...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));draw()};
draw();
</script></body></html>
