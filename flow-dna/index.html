<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flow DNA · The Skill Marketplace by Flow Media AI</title>
<meta name="description" content="KI-Skills, Agenten und Workflows für dein Business – Free zum Download, Premium zum Mieten, Kaufen oder mit Einrichtung. Für Claude Code und Codex.">
<meta property="og:title" content="Flow DNA – The Skill Marketplace"><meta property="og:description" content="Your Business. Your AI. Your Flow."><meta property="og:image" content="img/maik_front.jpg">
<meta name="theme-color" content="#F4F4F1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kern.css">
<style>
/* Flow DNA live (08.11.2026) – aus v6: Design von v4 (Katalog, hell) · Übersicht von v2 (Terminal, kompakt) · Animation von v3 (DNA-Strang) · App-Form von v5 */
:root{--ink:#0B0B0B;--paper:#F4F4F1;--blue:#2F5BFF;--mute:#6b6b66;--rule:rgba(11,11,11,.14);
 --dna-x-ink:#0B0B0B;--dna-x-line:rgba(11,11,11,.18);--dna-card:#FFFFFF;--dna-ink:#0B0B0B;--dna-muted:rgba(11,11,11,.55);--dna-line:rgba(11,11,11,.14)}
.dna-b-basis{color:#0B0B0B;border-color:#0B0B0B}.dna-modal input,.dna-modal textarea,.dna-modal select{background:#f4f4f1}.dna-x{color:#0B0B0B}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#E9E9E4;color:#2b2b2b;font:400 15px/1.5 Inter,sans-serif;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:820px;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:840px){.app{border-left:2px solid var(--ink);border-right:2px solid var(--ink)}}
h2,h3{overflow-wrap:anywhere;hyphens:auto}
/* header */
.hd{padding:10px 16px 8px;border-bottom:2px solid var(--ink)}
.hd .row1{display:flex;align-items:center;gap:12px}
.hd img{height:20px;filter:invert(1)}
.hd .sp{flex:1}
.word{display:flex;align-items:center;gap:8px;font:700 24px/1 Oswald;text-transform:uppercase;color:var(--ink)}.word span{color:var(--blue)}
#helix{width:64px;height:24px;display:block}
.claim{font:600 10px Montserrat;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:4px}@media(max-width:600px){.claim{display:none}}
/* controls */
.ctl{padding:8px 16px 7px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--rule)}
.ctl .top{display:flex;gap:8px;align-items:center}
.ctl.min .chips{display:none}
.ctl input{flex:1;min-width:0;width:auto;min-height:34px;font-size:15px!important;border:0;border-bottom:2px solid var(--ink);background:transparent;font:500 16px Inter;padding:0 2px;outline:none;color:var(--ink)}
.seg{display:flex;flex:none}.seg button{border:1.5px solid var(--ink);background:#fff;font:600 11px Inter;padding:6px 7px;cursor:pointer;margin-left:-1.5px;color:var(--ink)}.seg button:first-child{margin-left:0}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--rule);background:transparent;font:600 10.5px Montserrat;letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;cursor:pointer;color:var(--ink)}
.chips button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.meta{display:flex;justify-content:space-between;font:600 11px Montserrat;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:8px 18px 4px}
/* compact list */
.view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.cat{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;gap:8px;align-items:baseline;padding:8px 16px 5px;border-bottom:2px solid var(--ink);font:700 12px Montserrat;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.cat i{font-style:normal;color:var(--blue)}.cat em{font-style:normal;margin-left:auto;color:var(--mute);font-weight:600}
.r{display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--rule);cursor:pointer}
.r:hover{background:#fff}.r .no{font:700 15px Oswald;color:#b9b9b3}.r:hover .no{color:var(--blue)}
.r .ic{font-size:18px;text-align:center}
.r .t{min-width:0}.r .t b{display:block;font:700 17px/1.1 Oswald;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .rt{text-align:right;white-space:nowrap}.r .pr{display:block;font:700 15px Oswald;text-transform:uppercase;color:var(--ink)}
.r.premium .pr{color:var(--blue)}
.r .st{display:inline-block;margin-top:2px;font:600 10px Montserrat;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--ink)}
.r .st.premium{background:var(--blue);border-color:var(--blue);color:#fff}.r .st.geplant{border-style:dashed;color:var(--mute);border-color:var(--mute)}
.r.geplant .t b{color:#7a7a74}
.r.flag{background:#fff}.r.flag .no{color:var(--blue)}
.empty{padding:30px 18px;color:var(--mute)}
.pane{padding:6px 18px 30px}
/* tabbar */
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;background:none;border:0;color:var(--mute);font:600 11px Montserrat;letter-spacing:.08em;text-transform:uppercase;padding:9px 0 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font:400 18px Inter;line-height:1}nav button.on{color:var(--ink)}nav button.on b{color:var(--blue)}
nav button .n{position:absolute;margin:-4px 0 0 18px;background:var(--blue);color:#fff;border-radius:9px;font:600 10px Inter;padding:1px 5px}
/* Signature */
.r.hl{background:linear-gradient(90deg,rgba(47,91,255,.12),rgba(47,91,255,0) 70%);box-shadow:inset 4px 0 0 var(--blue)}
.r.hl .no{color:var(--blue)}.r.hl .t b::after{content:" ★";color:var(--blue)}
.sig{padding:12px 0 6px;background:var(--ink);border-bottom:2px solid var(--ink)}
.sig-h{display:flex;align-items:baseline;gap:8px;padding:0 16px 10px;font:700 12px Montserrat;letter-spacing:.18em;text-transform:uppercase;color:#fff}
.sig-h i{font-style:normal;color:var(--blue)}@media(max-width:430px){.sig-h em{display:none}}.sig-h em{font-style:normal;margin-left:auto;color:rgba(255,255,255,.5);font-weight:600;letter-spacing:.08em}
.sig-row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}.sig-row::-webkit-scrollbar{display:none}
.sc{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:#16171A;border:1px solid rgba(47,91,255,.55);box-shadow:0 0 30px rgba(47,91,255,.18);padding:14px;cursor:pointer;color:#fff;position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 100% 0,rgba(47,91,255,.35),transparent 60%);pointer-events:none}
.sc .top{display:flex;align-items:center;gap:8px;position:relative}.sc .top span{font-size:22px}
.sc b{font:700 20px/1.05 Oswald;text-transform:uppercase}.sc p{margin:8px 0 10px;font-size:13px;line-height:1.4;color:rgba(255,255,255,.75);position:relative}
.sc .vid{position:absolute;right:10px;top:10px;font:600 10px Montserrat;letter-spacing:.1em;background:var(--blue);padding:3px 6px}
.mini{display:flex;align-items:center;gap:4px;position:relative}
.mini span{flex:1;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);animation:mini 3.6s infinite;animation-delay:calc(var(--i)*.55s)}
@keyframes mini{0%,100%{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);transform:none}12%{background:rgba(47,91,255,.55);border-color:#2F5BFF;transform:translateY(-2px)}30%{background:rgba(47,91,255,.18);border-color:rgba(47,91,255,.6);transform:none}}
@media(prefers-reduced-motion:reduce){.mini span{animation:none}}
/* Workshop-Edition */
.ws{margin:12px 16px 14px;border:2px solid var(--blue);background:#fff;box-shadow:0 10px 40px rgba(47,91,255,.18)}
.ws .wh{background:var(--blue);color:#fff;padding:8px 12px;font:700 11px Montserrat;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.ws .wb{padding:14px}
.ws h2{font:700 30px/1 Oswald;text-transform:uppercase;color:var(--ink);margin:0}
.ws h2 span{color:var(--blue)}
.ws .sub{font-size:14px;color:var(--mute);margin:6px 0 12px}
.ws .dl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px}
.ws .dl a{flex:1;min-width:140px;text-align:center;text-decoration:none;font:600 14px Inter;padding:12px 10px;border:2px solid var(--ink);color:var(--ink);background:#fff}
.ws .dl a.main{background:var(--ink);color:#fff}
.ws ol{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--ink)}
.wst{display:flex;gap:6px}.wst span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:1.5px solid var(--rule);font:600 11px Inter;color:var(--mute);text-align:center;animation:wst 3.2s infinite;animation-delay:calc(var(--i)*.6s)}.wst b{font-size:20px;font-weight:400}
@keyframes wst{0%,100%{border-color:var(--rule);color:var(--mute);background:#fff}12%{border-color:var(--blue);color:var(--ink);background:rgba(47,91,255,.10)}35%{border-color:var(--blue);color:var(--ink);background:#fff}}
@media(prefers-reduced-motion:reduce){.wst span{animation:none}}
.ws .bonus{margin-top:10px;font-size:13px;color:var(--ink);border-left:3px solid var(--blue);padding-left:8px}
.legal{font-size:13px;color:var(--mute);margin:10px 0 0}.legal a{color:var(--ink)}
.hd a{display:flex}
</style></head><body>
<div class="app">
  <header class="hd">
    <div class="row1"><div class="word"><svg id="helix" viewBox="0 0 84 30" aria-hidden="true"></svg>Flow <span>DNA</span></div><span class="sp"></span><a href="../marketing/landing-page/" aria-label="Zu Flow Media AI"><img src="img/logo_flow.png" alt="Flow Media AI"></a></div>
    <div class="claim">Your Business. Your AI. Your Flow. · The Skill Marketplace</div>
  </header>
  <div class="ctl" id="ctl">
    <div class="top"><input id="q" type="search" placeholder="Skill suchen …" aria-label="Skills durchsuchen">
    <div class="seg" id="seg"><button data-st="alle" class="on">Alle</button><button data-st="basis">Free</button><button data-st="premium">Pro</button><button data-st="community" title="Community">Comm.</button></div></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="meta" id="meta"></div>
  <main class="view" id="view"></main>
  <nav id="nav"><button data-tab="list" class="on"><b>☰</b>Entdecken</button><button data-tab="mine"><b>☆</b>Meine<span class="n" id="mc" hidden></span></button><button data-tab="sell"><b>＋</b>Verkaufen</button><button data-tab="more"><b>◎</b>Mehr</button></nav>
</div>
<script src="daten.js"></script><script src="kern.js"></script>
<script>
const st={stufe:"alle",kat:"alle",q:""};
// Workshop-Edition (?workshop=website): Website Builder für Teilnehmende kostenlos, oben angepinnt
const WS=new URLSearchParams(location.search).get("workshop")==="website";
const WS_DL="https://drive.google.com/uc?export=download&id=1fU9kfhb4xpcQdizXtRzyWsHnVNVH4_wJ",WS_VIEW="https://drive.google.com/file/d/1fU9kfhb4xpcQdizXtRzyWsHnVNVH4_wJ/view";
if(WS){const w=DNA.skills.find(s=>s.id==="website");Object.assign(w,{stufe:"basis",quelle:WS_DL,hinweis:"Workshop-Edition: für Teilnehmende des Workshops „Deine Website“ kostenlos."});document.title="Flow DNA · Workshop „Deine Website“"}let tab="list";const view=document.getElementById("view");
document.getElementById("chips").innerHTML=`<button data-kat="alle" class="on">Alle</button>`+DNA.kategorien.map(k=>`<button data-kat="${k.id}">${k.nr} ${k.name}</button>`).join("");
const row=(s,n)=>`<div class="r ${s.stufe} ${s.status==="geplant"?"geplant":""} ${s.flagship?"flag":""} ${s.highlight?"hl":""}" data-skill="${s.id}"><span class="no">${String(n).padStart(2,"0")}</span><span class="ic">${s.icon}</span><span class="t"><b>${DNA.esc(s.name)}</b><span>${DNA.esc(s.kurz)}</span></span><span class="rt"><span class="pr">${DNA.preis(s)}</span><span class="st ${s.status==="geplant"?"geplant":s.stufe}">${s.status==="geplant"?"Geplant":s.status==="vorbereitung"?DNA.stufen[s.stufe].name+" · bald":DNA.stufen[s.stufe].name}</span></span></div>`;
function list(){const L=DNA.filter(st);let n=0;
 document.getElementById("meta").innerHTML="";
 if(!L.length){view.innerHTML=`<div class="empty">${st.stufe==="community"?"Noch keine Community-Skills. Sei der oder die Erste – Tab „Verkaufen“.":"Nichts gefunden."}</div>`;return}
 const sigOn=!st.q&&st.kat==="alle"&&(st.stufe==="alle"||st.stufe==="premium"),H=DNA.skills.filter(s=>s.highlight);
 const sig=sigOn?`<div class="sig"><div class="sig-h"><i>★</i>Signature-Skills<em>Maiks stärkste Systeme</em></div><div class="sig-row">${H.map(s=>`<div class="sc" data-skill="${s.id}">${s.video?`<span class="vid">▶ VIDEO</span>`:""}<div class="top"><span>${s.icon}</span><b>${DNA.esc(s.name)}</b></div><p>${DNA.esc(s.kurz)}</p><div class="mini">${s.ablauf.map((a,i)=>`<span style="--i:${i}" title="${DNA.esc(a[1])}">${a[0]}</span>`).join("")}</div></div>`).join("")}</div></div>`:"";
 const wsBox=WS&&!st.q?`<div class="ws"><div class="wh"><span>Workshop-Edition</span><span>kostenlos für Teilnehmende</span></div><div class="wb">
  <h2>Mit KI zur Personal Brand: <span>Deine Website</span></h2>
  <p class="sub">Mo 09.11. & Di 10.11. · 18–19 Uhr · live</p>
  <div class="wst">${DNA.skills.find(s=>s.id==="website").ablauf.map((a,i)=>`<span style="--i:${i}"><b>${a[0]}</b>${DNA.esc(a[1])}</span>`).join("")}</div>
  <div class="dl"><a class="main" href="${WS_DL}" target="_blank" rel="noopener">⬇ Website-Skill laden</a><a href="${WS_VIEW}" target="_blank" rel="noopener">Ansehen</a><a href="skills/personal-brand/SKILL.md" target="_blank" rel="noopener">+ Personal-Brand-Skill</a></div>
  <ol><li>Ordner <b>website-builder</b> anlegen, Datei als <b>SKILL.md</b> hineinlegen.</li><li>Claude Code: nach <b>.claude/skills/</b> · Claude-App: Ordner zippen → Einstellungen → Fähigkeiten → Skills → hochladen.</li><li>Deinen Content-Ordner bereitlegen (Fotos, Videos, Texte) und sagen: „Bau mir meine Website.“</li></ol>
  <p class="bonus">🛠️ Bonus: kostenloser Tech-Support und Q&amp;A im Tech-Support-Channel bis 31.12.26.</p>
 </div></div>`:"";
 view.innerHTML=wsBox+(WS?"":sig)+DNA.kategorien.map(k=>{const K=L.filter(s=>s.kat===k.id);if(!K.length)return"";return `<div class="cat"><i>${k.nr}</i>${k.name}<em>${K.length}</em></div>`+K.map(s=>row(s,++n)).join("")}).join("")}
function mine(){const M=DNA.saved().map(id=>DNA.skills.find(s=>s.id===id)).filter(Boolean);
 document.getElementById("meta").innerHTML=`<span>Meine Skills</span><span>${M.length} gemerkt</span>`;
 view.innerHTML=M.length?`<div class="cat"><i>☆</i>Gemerkt</div>`+M.map((s,i)=>row(s,i+1)).join("")+`<p class="empty">Mit Konto stehen hier später auch deine gekauften Skills.</p>`:`<div class="empty">Noch nichts gemerkt. Tipp einen Skill an und drück „Merken“.</div>`}
function more(){document.getElementById("meta").innerHTML=`<span>Über Flow DNA</span><span>Roadmap · Creator</span>`;
 view.innerHTML=`<div class="pane"><p style="margin:16px 0 0;font-size:16px;color:#0B0B0B">${DNA.esc(DNA.marke.idee)}</p><div id="dna-extra"></div><p class="legal"><a href="skills/INSTALLATION.md" target="_blank" rel="noopener">Installation</a> · <a href="../marketing/landing-page/">Flow Media AI</a> · <a href="../marketing/landing-page/impressum.html">Impressum</a> · <a href="../marketing/landing-page/datenschutz.html">Datenschutz</a></p></div>`;DNA.renderExtras();
 const m=document.querySelector("#dna-extra .dna-x-sec");if(m)m.remove()}  // "Meine Skills" hat einen eigenen Tab
function render(){document.getElementById("ctl").style.display=tab==="list"?"":"none";document.getElementById("meta").style.display=tab==="list"?"none":"";tab==="list"?list():tab==="mine"?mine():more();
 const c=DNA.saved().length,mc=document.getElementById("mc");mc.hidden=!c;mc.textContent=c}
document.getElementById("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.stufe=b.dataset.st;[...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));list()};
document.getElementById("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.kat=b.dataset.kat;[...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));list()};
document.getElementById("q").oninput=e=>{st.q=e.target.value;list()};
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab==="sell"){DNA.openSubmit();return}
 tab=b.dataset.tab;[...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));view.scrollTop=0;render()};
// Merken im Detail-Fenster aktualisiert Zähler und "Meine"
document.addEventListener("click",e=>{if(e.target.closest("[data-dna-save]"))setTimeout(()=>{const c=DNA.saved().length,mc=document.getElementById("mc");mc.hidden=!c;mc.textContent=c;if(tab==="mine")mine()})});
// kleiner DNA-Strang (aus v3) als Animation neben dem Namen
const hx=document.getElementById("helix");
function helix(t){let a="",b="",r="";for(let x=0;x<=84;x+=3){const p=x/11+t/700,y1=15+Math.sin(p)*11,y2=15-Math.sin(p)*11;a+=(x?"L":"M")+x+","+y1.toFixed(1);b+=(x?"L":"M")+x+","+y2.toFixed(1);if(x%9===0)r+=`<line x1="${x}" y1="${y1.toFixed(1)}" x2="${x}" y2="${y2.toFixed(1)}" stroke="rgba(11,11,11,.25)" stroke-width="1.5"/>`}
 hx.innerHTML=r+`<path d="${a}" fill="none" stroke="#2F5BFF" stroke-width="2.6"/><path d="${b}" fill="none" stroke="#0B0B0B" stroke-width="2"/>`;
 if(!matchMedia("(prefers-reduced-motion: reduce)").matches)requestAnimationFrame(helix)}
requestAnimationFrame(helix);
view.addEventListener("scroll",()=>{if(tab==="list")document.getElementById("ctl").classList.toggle("min",view.scrollTop>40)});
render();
</script></body></html>
